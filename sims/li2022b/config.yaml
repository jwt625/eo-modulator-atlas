# Version-of-record parameters (Optics Express 30(20) 36394). Supersedes the arXiv v1 based config: adds the 300 nm SiO2 over-cladding,
# g = 5.5 um (Fig. 4 caption; text says 5.9 um, see alt_geometries.gap_5p9), simulated VpiL 0.90 V cm, n_o 2.514, n_RF about 1.98.
# Conventions follow sims/chen2022/config.yaml. Coordinate frame: x lateral, y film normal up, z propagation. y = 0 at the BOX top / LN bottom.
# Origin: optical axis of the RIGHT-hand waveguide in x. Signal electrode centre (mirror plane) at x = -9.65 um; LEFT waveguide at x = -19.3 um.
# Both arms are in the electrostatic domain (symmetry none); the optical mode is solved on the right arm.
