schema: eo-atlas.sim/v1
id: li2022b-a
paper_id: li2022b
device_id: li2022b-a
title: Li 2022b, 3.3 mm visible-light (532 nm) TFLN MZM on silicon with CPW traveling-wave electrode (push-pull arms), arXiv v1 design parameters
repro_grade: B
validation_status: unvalidated
chain: [electrostatics, optical_mode, eo_overlap, rf_line, eo_response]

# Conventions follow sims/chen2022/config.yaml and sims/liu2021/config.yaml.
# Coordinate frame: x lateral, y film normal up, z propagation. y = 0 at the BOX top / LN bottom.
# Origin: optical axis of the RIGHT-hand waveguide in x. Signal electrode centre (mirror plane) at x = -9.65 um; LEFT waveguide at x = -19.3 um.
# Both arms are in the electrostatic domain (symmetry none); the optical mode is solved on the right arm. Waveguides assumed centred in the 5.5 um gaps.
# Optical indices at 532 nm are NOT given by the paper and are left out; the optical stage cannot run until they are supplied (see missing). Electrostatics can run.
# Geometry values are the arXiv v1 'designed' parameters (g, ws, wg, t); the fabricated dimensions are not separately reported.
optics:
  wavelength_nm: 532
  polarization: TE
  mode_index: 0
  group_index_from: finite_difference_wavelength
  ng_fixed: null
  eo_axis: auto

materials:
  lithium_niobate:
    crystal: {cut: x, propagation: y}
    eps_r: {perp: 43.0, par: 28.0}
    r_pm_per_v: {r13: 8.6, r22: 3.4, r33: 30.8, r51: 28.0}
  silicon_dioxide: {eps_r: 3.9}
  silicon: {eps_r: 11.7}
  gold: {conductor: true, sigma_Sm: 4.1e7, n_complex: null}
  air: {n: 1.0, eps_r: 1.0}

geometry:
  symmetry: none
  domain: {x_um: [-200, 150], y_um: [-250, 120]}
  regions:
    - {name: ambient, material: air, rect: {x_um: [-200, 150], y_um: [-250, 120]}}
    - {name: substrate, material: silicon, rect: {x_um: [-200, 150], y_um: [-250, -2]}}
    - {name: box, material: silicon_dioxide, rect: {x_um: [-200, 150], y_um: [-2, 0]}}
    - {name: ln_slab, material: lithium_niobate, rect: {x_um: [-200, 150], y_um: [0, 0.1]}}
    - {name: ln_rib_r, material: lithium_niobate, polygon_um: [[-0.8077, 0.1], [0.8077, 0.1], [0.75, 0.2], [-0.75, 0.2]]}
    - {name: ln_rib_l, material: lithium_niobate, polygon_um: [[-20.1077, 0.1], [-18.4923, 0.1], [-18.55, 0.2], [-20.05, 0.2]]}
  electrodes:
    - {name: signal, role: signal, weight: 1.0, rect: {x_um: [-16.55, -2.75], y_um: [0.1, 1.2]}, material: gold}
    - {name: ground_r, role: ground, weight: 0.0, rect: {x_um: [2.75, 62.75], y_um: [0.1, 1.2]}, material: gold}
    - {name: ground_l, role: ground, weight: 0.0, rect: {x_um: [-82.05, -22.05], y_um: [0.1, 1.2]}, material: gold}
  optical_window: {x_um: [-2.7, 2.7], y_um: [-1.5, 1.5]}
  mesh: {max_edge_um: 2.0, electrode_edge_um: 0.05}
line:
  length_mm: 3.3
  conductor_loss_model: skin_effect_wheeler
  rf_loss_table: null
  source_ohm: 50
  load_ohm: 50
  differential: false              # single-ended G-S-G probe on the centre line; push-pull arises from the arm placement (see provenance)
  loading: {type: none, period_um: null, loaded_length_um: null, unloaded_cross_section: null, loaded_cross_section: null}
sweep: {f_start_ghz: 0.1, f_stop_ghz: 120, n_points: 240}
alt_geometries: {}

targets:
  - {metric: vpi_l_dc_vcm, value: 1.1, tol_rel: 0.15, source: {device_id: li2022b-a, field: vpil_dc_vcm, comparable: false, note: "NON-COMPARABLE: LN constants at 532 nm are not given"}}
  - {metric: vpi_l_dc_vcm, value: 0.96, tol_rel: 0.1, source: {paper_id: li2022b, locator: "p.4 Fig. 4(e)", basis: simulated, note: "paper's own simulation of the designed cross-section; cross-solver reference, not a measurement"}}
  - {metric: ng_opt, value: 2.164, tol_abs: 0.05, source: {paper_id: li2022b, locator: "p.4 Fig. 4(b) label n_o = 2.164", basis: simulated, note: "depends on the missing LN indices"}}
  - {metric: n_rf, value: 2.07, tol_abs: 0.08, source: {paper_id: li2022b, locator: "p.4 Fig. 4(b), 40-100 GHz plateau 2.07-2.06", basis: extracted_from_figure, note: "paper-simulated RF effective index"}}
  - {metric: z0_ohm, value: 50, tol_abs: 1.5, source: {paper_id: li2022b, locator: "p.4 Fig. 4(d), 40-100 GHz plateau about 50 ohm", basis: extracted_from_figure, note: "paper-simulated characteristic impedance"}}
reported_curves: []

provenance:
  optics.wavelength_nm: {class: paper_exact, locator: "p.1 abstract; p.5 Sec. 3 (532 nm)"}
  optics.polarization: {class: project_inference, note: "TE assumed for x-cut with in-plane electrodes; polarization not stated"}
  optics.group_index_from: {class: project_inference, note: "paper quotes ng = 2.164 (Fig. 4(b), simulated); engine derives it"}
  materials.lithium_niobate.crystal: {class: paper_exact, locator: "p.2 Sec. 2 (x-cut)", note: "propagation along y is a project_inference from the standard x-cut convention"}
  materials.lithium_niobate.eps_r: {class: unknown, note: "UNVERIFIED placeholder 43/28 (SPEC.md example values); the paper states no RF permittivity"}
  materials.lithium_niobate.r_pm_per_v: {class: unknown, note: "UNVERIFIED placeholder (SPEC.md example values); the paper states no Pockels coefficients (values at 532 nm differ)"}
  materials.silicon_dioxide.eps_r: {class: unknown, note: "UNVERIFIED placeholder 3.9"}
  materials.silicon.eps_r: {class: unknown, note: "UNVERIFIED placeholder 11.7"}
  materials.gold.sigma_Sm: {class: unknown, note: "UNVERIFIED placeholder 4.1e7 S/m bulk gold; film conductivity not stated"}
  line.length_mm: {class: paper_exact, locator: "p.5 Sec. 4 (3.3 mm modulation length)"}
  line.source_ohm: {class: project_inference, note: "50 ohm assumed; Fig. 1 shows RF input and a 50 ohm load"}
  line.load_ohm: {class: paper_exact, locator: "p.2 Fig. 1 (50 ohm load); p.4 Fig. 4(d)"}
  line.differential: {class: project_inference, note: "CPW with one arm per gap; the paper states single-drive push-pull (p.5)"}
  line.conductor_loss_model: {class: project_inference, note: "paper's simulated alpha_m below 10 dB/cm to 120 GHz (Fig. 4(c)); loss model left to the engine"}
  geometry.regions.substrate: {class: project_inference, note: "silicon thickness not stated; region ends at the domain bottom (-250 um)"}
  geometry.regions.box: {class: paper_exact, locator: "p.2 Sec. 2 (2 um thermal oxide)"}
  geometry.regions.ln_slab: {class: paper_exact, locator: "p.2 Sec. 2 (200 nm film, 100 nm ridge height)", note: "slab 100 nm = 200 - 100"}
  geometry.regions.ln_rib_r: {class: project_inference, locator: "p.2 Sec. 2 (60 deg); p.4 Sec. 2 (w = 1.5 um)", note: "60 deg stated in the grating-coupler paragraph for all etched LN patterns; w taken as the top width (not stated)"}
  geometry.regions.ln_rib_l: {class: project_inference, note: "mirror image of the right-hand rib about x = -9.65 um"}
  geometry.electrodes.signal: {class: paper_exact, locator: "p.3-4 Sec. 2 (t = 1.1 um, g = 5.5 um, ws = 13.8 um; designed)", note: "bottom on the LN slab top (Fig. 4(a)); no cladding drawn"}
  geometry.electrodes.ground_r: {class: paper_exact, locator: "p.4 Sec. 2 (wg = 60 um; designed)", note: "inner edge 2.75 um from the right waveguide axis (waveguide assumed centred in the 5.5 um gap)"}
  geometry.electrodes.ground_l: {class: project_inference, note: "mirror of ground_r about the signal centre"}
  geometry.optical_window: {class: project_inference, note: "crop |x| < 2.7 um, just inside the 2.75 um electrode edge"}
  geometry.domain: {class: project_inference, note: "lateral -200..150 um, vertical -250..120 um"}
  geometry.mesh: {class: project_inference}

missing:
  - "LN ordinary and extraordinary indices at 532 nm (left out; optical stage cannot run)"
  - "SiO2 and silicon optical indices at 532 nm (left out)"
  - "RF permittivity and Pockels coefficients of LN, SiO2 and Si constants, gold conductivity (UNVERIFIED placeholders)"
  - "rib top vs bottom width"
  - "waveguide position inside the 5.5 um gap (assumed centred)"
  - "fabricated (as opposed to designed) electrode dimensions"
  - "silicon substrate thickness"
  - "cladding (none drawn in Fig. 4(a))"
  - "temperature"
limitations:
  - scalar_optical_not_full_vector
  - quasi_static_2d_rf
  - rectangular_or_polygon_sidewalls_only
  - no_3d_launch_pad_effects
  - "Optical stage blocked: no LN indices at 532 nm are given in the paper"
  - "Geometry is the designed cross-section; fabricated values are not reported"
  - "Measured EO bandwidth (> 30 GHz) is limited by the 25 GHz photodetector and is not a target"
  - "Total insertion loss 18.8 dB is dominated by grating couplers and 2.2 dB/mm propagation loss; not modelled"
