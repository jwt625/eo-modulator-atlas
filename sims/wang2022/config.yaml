targets:
  # Measured, 12.5 mm device (devices.csv row wang2022-a)
  - {metric: vpi_l_dc_vcm, value: 2.13, tol_rel: 0.15, source: {device_id: wang2022-a, field: vpil_dc_vcm}}
  - {metric: n_rf, value: 2.6, tol_abs: 0.15, source: {device_id: wang2022-a, field: n_rf}}
  - {metric: rf_loss_db_per_cm, at_ghz: 67, value: 4.01, tol_rel: 0.2, source: {device_id: wang2022-a, field: rf_loss_db_per_cm}}
  # Paper's own simulation of the design geometry (Fig. 2); compare as cross-solver reference, not as measurement
  - {metric: vpi_l_dc_vcm, value: 2.4, tol_rel: 0.1, source: {paper_id: wang2022, locator: "p.3 Sec. Device Design and Fabrication; Fig. 2(a); supplement p.3", basis: simulated}}
  - {metric: ng_opt, value: 2.5, tol_abs: 0.1, source: {device_id: wang2022-a, field: ng_opt}}
  - {metric: n_rf, value: 2.5, tol_abs: 0.1, source: {paper_id: wang2022, locator: "p.3, Fig. 2(d), blue curve with undercut etching, 2.45-2.6 over 0-100 GHz", basis: extracted_from_figure}}
  - {metric: z0_ohm, value: 50.3, tol_abs: 1.5, source: {paper_id: wang2022, locator: "p.3, Fig. 2(c), 10-85 GHz plateau", basis: extracted_from_figure}}
  - {metric: rf_loss_db_per_cm, at_ghz: 67, value: 1.72, tol_rel: 0.2, source: {paper_id: wang2022, locator: "p.3 alpha0 = 0.21 dB/cm/GHz^0.5 from Fig. 2(e); 0.21*sqrt(67)", basis: derived}}
  # Not targets: measured Z0 (ripples 48-55 ohm, Fig. 4(b), no single value); 3 dB EO bandwidth (>70 GHz bound; plotted trace ends near 67 GHz; simulated 100 GHz is a model fit)
reported_curves: []

provenance:
  optics.wavelength_nm: {class: paper_exact, locator: "p.3 (finite element analysis at 1550 nm wavelength); supplement p.2 (modes at 1550 nm)"}
  optics.polarization: {class: paper_exact, locator: "p.2-3 (fundamental TE mode of the hybrid waveguide, Fig. 1(d), 2(a))"}
  optics.group_index_from: {class: project_inference, note: "paper marks a simulated optical group index of about 2.5 in Fig. 2(d) (and supplement Fig. S1(a) vs width); engine derives it by finite difference and compares as a target"}
  materials.lithium_niobate.crystal: {class: project_inference, locator: "p.2 (500 nm thick x-cut TFLN, paper_exact for the cut); propagation along crystal y inferred from the Ez / z-axis field in supplement p.3 (Delta n_z = -n_e^3 r33 Ez / 2) and Fig. 1(a)"}
  materials.lithium_niobate.n_o: {class: standard_reference, citation: "Mao et al., APL Photon. 7, 126103 (2022) (references/mao2022/text.md p.3, printed 126103-2: n_ord,LN = 2.211)", note: "paper states no LN indices; value used by another Si-LN hybrid paper at 1550 nm"}
  materials.lithium_niobate.n_e: {class: standard_reference, citation: "Mao et al., APL Photon. 7, 126103 (2022) (references/mao2022/text.md p.3, printed 126103-2: n_ext,LN = 2.138)", note: "paper states no LN indices"}
  materials.lithium_niobate.eps_r: {class: unknown, note: "UNVERIFIED placeholder perp 43, par 28 (no source read for 43); references/lee2026/text.md p.2 quotes eps_LN = 28 along the Z axis only; the paper states no RF permittivity"}
  materials.lithium_niobate.r_pm_per_v: {class: unknown, note: "UNVERIFIED placeholder r13 8.6, r22 3.4, r33 30.8, r51 28; references/liu2025b/text.md p.1 quotes gamma33 = 30.8 pm/V at 630 nm only; the paper uses r33 symbolically (supplement p.3)"}
  materials.silicon_dioxide.n: {class: standard_reference, citation: "Mao et al., APL Photon. 7, 126103 (2022) (references/mao2022/text.md p.3, printed 126103-2: nSiO2 = 1.444)", note: "the paper states no SiO2 index"}
  materials.silicon_dioxide.eps_r: {class: standard_reference, citation: "Yang et al., Chin. Opt. Lett. 20, 022502 (references/yang2022/text.md p.2: SiO2 eps about 3.9)", note: "value quoted by another paper; this paper gives no SiO2 permittivity"}
  materials.silicon.n: {class: standard_reference, citation: "Mao et al., APL Photon. 7, 126103 (2022) (references/mao2022/text.md p.3, printed 126103-2: nSi = 3.475)", note: "index of the Si wire; the paper states none"}
  materials.silicon.eps_r: {class: standard_reference, citation: "Yang et al., Chin. Opt. Lett. 20, 022502 (references/yang2022/text.md p.2: Si eps about 11.9)", note: "value quoted by another paper; this paper states no silicon permittivity or substrate resistivity"}
  materials.benzocyclobutene.n: {class: unknown, note: "UNVERIFIED placeholder 1.54; no BCB refractive index in the paper or in any repo source read"}
  materials.benzocyclobutene.eps_r: {class: standard_reference, citation: "Liu et al. (liu2025) (references/liu2025/text.md p.5: low dielectric constant (eps = 2.56) BCB underfill)", note: "value quoted by another paper for BCB; this paper gives no BCB permittivity"}
  materials.gold.sigma_Sm: {class: unknown, note: "UNVERIFIED placeholder 4.1e7 S/m (no source read); the paper does not state the film conductivity (extra RF loss attributed to oxide dielectric loss and rough metal, p.4)"}
  materials.air: {class: standard_reference, note: "definitional (index 1, eps 1)"}
  line.length_mm: {class: paper_exact, locator: "p.3 (12.5 mm modulation section); p.4 Fig. 3"}
  line.source_ohm: {class: project_inference, note: "VNA and probe assumed 50 ohm; Z0 designed for 50 ohm (p.3)"}
  line.load_ohm: {class: project_inference, note: "off-chip 50 ohm termination through a second probe (supplement p.5 describes it for the data runs); assumed for the S21 as well"}
  line.differential: {class: project_inference, note: "single G-S-G probe on the centre signal line, one waveguide in each gap (Fig. 1(a)); supplement p.3 calls the device push-pull"}
  line.conductor_loss_model: {class: project_inference, note: "paper reports alpha0 simulated 0.21 and measured 0.49 dB/cm/GHz^0.5; loss model left to the engine"}
  line.loading.period_um: {class: paper_exact, locator: "supplement p.3 (duty cycle r/(r+c) = 47/50, r = 47 um, c = 3 um, p.3)"}
  line.loading.loaded_length_um: {class: project_inference, locator: "p.3 (r, c, L) = (47, 3, 36) um; Fig. 1(c)", note: "Fig. 1(c) shows the hole L centred on the gap c between the T-bars of one period r + c = 50 um, so slot and T-bar pads coexist over L - c = 36 - 3 = 33 um; the remaining 17 um of the period are the c = 3 um gap (slot without bar, equals the unloaded cut) and the 14 um stem region (T-bar without slot, not representable in the two-cross-section cascade and approximated by the unloaded cut); an earlier draft used L = 36 as the coexistence length (2 x 18 = 36 holds for chen2022, not here)"}
  geometry.regions.substrate: {class: project_inference, locator: "p.2 (SOI wafer)", note: "thickness not stated; region cut at the domain bottom"}
  geometry.regions.box: {class: paper_exact, locator: "p.2 (2 um buried oxide)"}
  geometry.regions.bcb: {class: figure_digitized, locator: "Fig. 2(a) p.3 (authors' mode solve, 500 nm scale bar); p.2 (150 nm BCB bonding layer); supplement p.4", note: "Fig. 2(a) shows the 220 nm Si wire at the bottom of the layer between the BOX and the LN with 150 nm BCB above the wire, i.e. a total BCB/wire layer of about 0.37 um (LN 0.5 um and the 0.65 um SiO2 cladding on the same scale read 0.51 and 0.66 um); BCB from y = 0 to 0.37 um planarizes the wire; the text gives only the 150 nm figure"}
  geometry.regions.si_wire_r: {class: paper_exact, locator: "p.2 (220 nm top silicon, w2 = 0.28 um in the modulation section)", note: "wire centred on the right waveguide axis"}
  geometry.regions.si_wire_l: {class: project_inference, note: "mirror image of the right-hand wire about the signal centre"}
  geometry.regions.ln_film: {class: paper_exact, locator: "p.2 (500 nm thick x-cut TFLN, not etched)"}
  geometry.regions.sio2_cladding: {class: paper_exact, locator: "p.3 (650 nm SiO2 over-cladding); supplement p.4 (PECVD)"}
  geometry.regions.slot_r_inner: {class: project_inference, locator: "p.3 (w = 13, h = 19 um); Fig. 1(b),(c); supplement p.4 (holes through SiO2 and BOX to the Si substrate, LN holes to the BOX)", note: "hole width w = 13 um from the stated list; slot position taken as the T-bar outer edge + 3 um, so that h = 19 um = 3 + 13 + 3 um as in the chen2022 layout (islands of 3 um); the Fig. 1(b) is not to scale; Fig. 2(b) is roughly to scale laterally and agrees (slot about 12 um, waveguide island about 14.5 um, signal island about 71 um), so the class stays project_inference at the 1-3 um level"}
  geometry.regions.slot_r_outer: {class: project_inference, note: "see slot_r_inner; mirror about the waveguide axis"}
  geometry.regions.slot_l_inner: {class: project_inference, note: "mirror of the right-hand slots about the signal centre"}
  geometry.regions.slot_l_outer: {class: project_inference, note: "mirror of the right-hand slots about the signal centre"}
  geometry.regions.undercut_r_inner: {class: project_inference, locator: "p.3 (undercut-etched for about 28 um); Fig. 1(b), 2(b)", note: "modelled as a 28 um radius half-disc centred on each slot centre at the Si top surface; the arcs in the sketches are circular, true etch shape unreported"}
  geometry.regions.undercut_r_outer: {class: project_inference, note: "see undercut_r_inner"}
  geometry.regions.undercut_l_inner: {class: project_inference, note: "see undercut_r_inner"}
  geometry.regions.undercut_l_outer: {class: project_inference, note: "see undercut_r_inner"}
  geometry.electrodes.signal: {class: project_inference, locator: "p.2 (Ws = 65 um), p.3 (D = 1.1 um)", note: "width and thickness from the text; inner edge placed h = 19 um beyond the T-bar outer edge (chen2022 analogy); Fig. 1(c) p.2 draws h from the main-rail edge to the stem-side edge of the T-bar (h excludes the bar width s), so the inner edge is h = 19 = 3 + 13 + 3 um beyond the bar outer edge"}
  geometry.electrodes.ground_r: {class: project_inference, note: "ground width not stated; taken equal to the signal width; inner edge as for the signal electrode"}
  geometry.electrodes.ground_l: {class: project_inference, note: "mirror of ground_r about the signal centre"}
  geometry.electrodes.pad_r_signal_side: {class: project_inference, locator: "p.3 (g = 2.28 um, d = 200 nm, s = 3 um), Fig. 1(b),(c)", note: "T-bar thickness d = 200 nm and gap g = 2.28 um from the text, bar width s = 3 um from the stated dimension list; pad connected to the signal electrode by a stem not modelled in 2D, so it is given signal potential"}
  geometry.electrodes.pad_r_ground_side: {class: project_inference, note: "ground-connected T-bar, see pad_r_signal_side"}
