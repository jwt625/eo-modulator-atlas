      - {name: slot_r_inner, material: air, rect: {x_um: [-20.14, -7.14], y_um: [-2, 1.52]}}
      - {name: slot_r_outer, material: air, rect: {x_um: [7.14, 20.14], y_um: [-2, 1.52]}}
