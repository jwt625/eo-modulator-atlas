schema: eo-atlas.sim/v1
id: wang2022-a
paper_id: wang2022
device_id: wang2022-a
title: Wang 2022, 12.5 mm Si-TFLN hybrid CLTW MZM on undercut silicon (G-S-G, push-pull arms, LN not etched)
repro_grade: B
validation_status: unvalidated
chain: [electrostatics, optical_mode, eo_overlap, rf_line, loaded_line, eo_response]

# Conventions follow sims/chen2022/config.yaml.
# Coordinate frame: x lateral, y film normal up, z propagation. y = 0 at the BOX top (Si wire bottom).
# Origin: optical axis of the RIGHT-hand hybrid waveguide in x. Signal electrode centre (mirror plane) at x = -55.64 um; LEFT waveguide at x = -111.28 um.
# Both arms are in the electrostatic domain (symmetry none); the optical mode is solved on the right arm (hybrid Si wire + LN film).
# Fig. 1(b) is NOT to scale (65 um signal drawn about as wide as the 0.5 um LN stack is thick). Fig. 2(b) (authors' RF simulation cross-section) is roughly to
# scale laterally (65 um Au signal as scale: waveguide island about 14.5 um, slot about 12 um, signal island about 71 um, undercut reaching about 28 um from
# each slot centre) but not vertically (layer stack drawn about 6 um vs 3.5 um nominal), so it corroborates the lateral layout. The lateral layout
# (slots, islands, electrode edges) is built from the stated top-view dimensions with 3 um islands as in chen2022; see provenance.
optics:
  wavelength_nm: 1550
  polarization: TE
  mode_index: 0
  group_index_from: finite_difference_wavelength
  ng_fixed: null
  eo_axis: auto

materials:
  lithium_niobate:
    crystal: {cut: x, propagation: y}
    n_o: 2.211
    n_e: 2.138
    eps_r: {perp: 43.0, par: 28.0}
    r_pm_per_v: {r13: 8.6, r22: 3.4, r33: 30.8, r51: 28.0}
  silicon_dioxide: {n: 1.444, eps_r: 3.9}
  silicon: {n: 3.475, eps_r: 11.9}
  benzocyclobutene: {n: 1.54, eps_r: 2.56}
  gold: {conductor: true, sigma_Sm: 4.1e7, n_complex: null}
  air: {n: 1.0, eps_r: 1.0}

geometry:                          # LOADED cross-section: slots + undercut + T-bar pads
  symmetry: none
  domain: {x_um: [-300, 190], y_um: [-250, 120]}
  regions:
    - {name: ambient, material: air, rect: {x_um: [-300, 190], y_um: [-250, 120]}}
    - {name: substrate, material: silicon, rect: {x_um: [-300, 190], y_um: [-250, -2]}}
    - {name: box, material: silicon_dioxide, rect: {x_um: [-300, 190], y_um: [-2, 0]}}
    - {name: bcb, material: benzocyclobutene, rect: {x_um: [-300, 190], y_um: [0, 0.37]}}
    - {name: si_wire_r, material: silicon, rect: {x_um: [-0.14, 0.14], y_um: [0, 0.22]}}
    - {name: si_wire_l, material: silicon, rect: {x_um: [-111.42, -111.14], y_um: [0, 0.22]}}
    - {name: ln_film, material: lithium_niobate, rect: {x_um: [-300, 190], y_um: [0.37, 0.87]}}
    - {name: sio2_cladding, material: silicon_dioxide, rect: {x_um: [-300, 190], y_um: [0.87, 1.52]}}
    - {name: slot_r_inner, material: air, rect: {x_um: [-20.14, -7.14], y_um: [-2, 1.52]}}
    - {name: slot_r_outer, material: air, rect: {x_um: [7.14, 20.14], y_um: [-2, 1.52]}}
    - {name: slot_l_inner, material: air, rect: {x_um: [-104.14, -91.14], y_um: [-2, 1.52]}}
    - {name: slot_l_outer, material: air, rect: {x_um: [-131.42, -118.42], y_um: [-2, 1.52]}}
    - {name: undercut_r_inner, material: air, polygon_um: [[14.36, -2.0], [13.93, -6.86], [12.67, -11.58], [10.61, -16.0], [7.81, -20.0], [4.36, -23.45], [0.36, -26.25], [-4.06, -28.31], [-8.78, -29.57], [-13.64, -30.0], [-18.5, -29.57], [-23.22, -28.31], [-27.64, -26.25], [-31.64, -23.45], [-35.09, -20.0], [-37.89, -16.0], [-39.95, -11.58], [-41.21, -6.86], [-41.64, -2.0]]}
    - {name: undercut_r_outer, material: air, polygon_um: [[41.64, -2.0], [41.21, -6.86], [39.95, -11.58], [37.89, -16.0], [35.09, -20.0], [31.64, -23.45], [27.64, -26.25], [23.22, -28.31], [18.5, -29.57], [13.64, -30.0], [8.78, -29.57], [4.06, -28.31], [-0.36, -26.25], [-4.36, -23.45], [-7.81, -20.0], [-10.61, -16.0], [-12.67, -11.58], [-13.93, -6.86], [-14.36, -2.0]]}
    - {name: undercut_l_inner, material: air, polygon_um: [[-69.64, -2.0], [-70.07, -6.86], [-71.33, -11.58], [-73.39, -16.0], [-76.19, -20.0], [-79.64, -23.45], [-83.64, -26.25], [-88.06, -28.31], [-92.78, -29.57], [-97.64, -30.0], [-102.5, -29.57], [-107.22, -28.31], [-111.64, -26.25], [-115.64, -23.45], [-119.09, -20.0], [-121.89, -16.0], [-123.95, -11.58], [-125.21, -6.86], [-125.64, -2.0]]}
    - {name: undercut_l_outer, material: air, polygon_um: [[-96.92, -2.0], [-97.35, -6.86], [-98.61, -11.58], [-100.67, -16.0], [-103.47, -20.0], [-106.92, -23.45], [-110.92, -26.25], [-115.34, -28.31], [-120.06, -29.57], [-124.92, -30.0], [-129.78, -29.57], [-134.5, -28.31], [-138.92, -26.25], [-142.92, -23.45], [-146.37, -20.0], [-149.17, -16.0], [-151.23, -11.58], [-152.49, -6.86], [-152.92, -2.0]]}
  electrodes:
    - {name: signal, role: signal, weight: 1.0, rect: {x_um: [-88.14, -23.14], y_um: [1.52, 2.62]}, material: gold}
    - {name: ground_r, role: ground, weight: 0.0, rect: {x_um: [23.14, 88.14], y_um: [1.52, 2.62]}, material: gold}
    - {name: ground_l, role: ground, weight: 0.0, rect: {x_um: [-199.42, -134.42], y_um: [1.52, 2.62]}, material: gold}
    - {name: pad_r_signal_side, role: signal, weight: 1.0, rect: {x_um: [-4.14, -1.14], y_um: [1.52, 1.72]}, material: gold}
    - {name: pad_r_ground_side, role: ground, weight: 0.0, rect: {x_um: [1.14, 4.14], y_um: [1.52, 1.72]}, material: gold}
    - {name: pad_l_signal_side, role: signal, weight: 1.0, rect: {x_um: [-110.14, -107.14], y_um: [1.52, 1.72]}, material: gold}
    - {name: pad_l_ground_side, role: ground, weight: 0.0, rect: {x_um: [-115.42, -112.42], y_um: [1.52, 1.72]}, material: gold}
  optical_window: {x_um: [-3, 3], y_um: [-1.2, 1.4]}
  mesh: {max_edge_um: 2.0, electrode_edge_um: 0.05}
line:
  length_mm: 12.5
  conductor_loss_model: skin_effect_wheeler
  rf_loss_table: null
  source_ohm: 50
  load_ohm: 50
  differential: false              # single-ended probe on the centre signal line; push-pull is produced by the arm placement
  loading:
    type: periodic_t_rail
    period_um: 50                  # r + c = 47 + 3 (supplement p.3 duty cycle 47/50)
    loaded_length_um: 33           # hole L = 36 um overlaps the T-bars over L - c = 33 um; see provenance
    unloaded_cross_section: unloaded
    loaded_cross_section: null     # null = top-level `geometry`
sweep: {f_start_ghz: 0.1, f_stop_ghz: 100, n_points: 200}

alt_geometries:
