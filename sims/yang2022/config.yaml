schema: eo-atlas.sim/v1
id: yang2022-a
paper_id: yang2022
device_id: yang2022-a
title: Yang 2022, 5 mm plain CPW TFLN MZM on silicon (photolithography and wet etch, 7 um gap, push-pull arms)
repro_grade: B
validation_status: unvalidated
chain: [electrostatics, optical_mode, eo_overlap, rf_line, eo_response]

# Conventions follow sims/chen2022/config.yaml.
# Coordinate frame: x lateral, y film normal up, z propagation. y = 0 at the BOX top / LN bottom.
# Origin: optical axis of the RIGHT-hand waveguide in x (waveguide assumed centred in its 7 um gap). Signal electrode centre (mirror plane) at x = -13.5; LEFT waveguide at x = -27.0.
# Both arms are in the electrostatic domain (symmetry none); the optical mode is solved on the right arm.
optics:
  wavelength_nm: 1550              # simulation wavelength of the paper (p.2); Vpi and EO S21 measurement wavelength not stated
  polarization: TE
  mode_index: 0
  group_index_from: finite_difference_wavelength
  ng_fixed: null
  eo_axis: auto

materials:
  lithium_niobate:
    crystal: {cut: x, propagation: y}
    n_o: 2.21
    n_e: 2.14
    eps_r: {perp: 38.0, par: 28.0}
    r_pm_per_v: {r33: 30.9, r51: 32.6}
  silicon_dioxide: {n: 1.444, eps_r: 3.9}
  silicon: {n: 3.475, eps_r: 11.9}
  gold: {conductor: true, sigma_Sm: 4.1e7, n_complex: null}
  air: {n: 1.0, eps_r: 1.0}

geometry:
  symmetry: none
  domain: {x_um: [-250, 225], y_um: [-250, 120]}
  regions:
    - {name: ambient, material: air, rect: {x_um: [-250, 225], y_um: [-250, 120]}}
    - {name: substrate, material: silicon, rect: {x_um: [-250, 225], y_um: [-529.7, -4.7]}}
    - {name: box, material: silicon_dioxide, rect: {x_um: [-250, 225], y_um: [-4.7, 0]}}
    - {name: ln_slab, material: lithium_niobate, rect: {x_um: [-250, 225], y_um: [0, 0.4]}}
    - {name: sio2_cladding, material: silicon_dioxide, rect: {x_um: [-250, 225], y_um: [0.4, 1.4]}}
    - {name: ln_rib_r, material: lithium_niobate, polygon_um: [[-0.65, 0.4], [0.65, 0.4], [0.65, 0.6], [-0.65, 0.6]]}
    - {name: ln_rib_l, material: lithium_niobate, polygon_um: [[-27.65, 0.4], [-26.35, 0.4], [-26.35, 0.6], [-27.65, 0.6]]}
  electrodes:
    - {name: signal, role: signal, weight: 1.0, rect: {x_um: [-23.5, -3.5], y_um: [0.4, 1.23]}, material: gold}
    - {name: ground_r, role: ground, weight: 0.0, rect: {x_um: [3.5, 23.5], y_um: [0.4, 1.23]}, material: gold}
    - {name: ground_l, role: ground, weight: 0.0, rect: {x_um: [-50.5, -30.5], y_um: [0.4, 1.23]}, material: gold}
  optical_window: {x_um: [-3.0, 3.0], y_um: [-1.5, 1.5]}
  mesh: {max_edge_um: 2.0, electrode_edge_um: 0.05}
line:
  length_mm: 5
  conductor_loss_model: skin_effect_wheeler
  rf_loss_table: null
  source_ohm: 50
  load_ohm: 50
  differential: false              # single-ended G-S-G probe on the centre line; push-pull arises from the arm placement
  loading: {type: none, period_um: null, loaded_length_um: null, unloaded_cross_section: null, loaded_cross_section: null}
sweep: {f_start_ghz: 0.1, f_stop_ghz: 110, n_points: 220}
alt_geometries: {}

targets:
  # Measured, 5 mm device (devices.csv row yang2022-a)
  - {metric: vpi_l_dc_vcm, value: 2.37, tol_rel: 0.15, source: {device_id: yang2022-a, field: vpil_dc_vcm}}
  - {metric: n_rf, value: 2.23, tol_abs: 0.1, source: {device_id: yang2022-a, field: n_rf}}
  - {metric: z0_ohm, value: 50, tol_abs: 5.0, source: {device_id: yang2022-a, field: z0_ohm, note: "authors extraction from EE S-parameters, ripples 45 to 65 ohm"}}
  - {metric: ng_opt, value: 2.24, tol_abs: 0.05, source: {device_id: yang2022-a, field: ng_opt, note: "author simulation (Lumerical mode solution, p.2), basis simulated; not a measurement"}}
  - {metric: eo_rolloff_db, at_ghz: 110, value: -2.5, tol_abs: 1.0, source: {device_id: yang2022-a, field: eo_rolloff_db, note: "reference 10 MHz"}}
  # Not a target: 3 dB EO bandwidth over 110 GHz was not crossed (bound; see SPEC_PROPOSALS)
reported_curves: []

provenance:
  optics.wavelength_nm: {class: paper_exact, locator: "p.2 Sec. 2 (group index simulated for the TE mode at 1550 nm)", note: "design wavelength; measurement wavelength not stated"}
  optics.polarization: {class: paper_exact, locator: "p.2 Sec. 2 (TE mode ridge waveguides)"}
  optics.group_index_from: {class: project_inference, note: "paper quotes No about 2.24 (p.2, Fig. 4(e)); engine derives it by finite difference and compares as a target"}
  materials.lithium_niobate.crystal: {class: project_inference, locator: "p.1-2 (x-cut TFLN, field along z)", note: "x-cut stated; propagation along crystal y inferred (field along the z axis in the plane, r33 used)"}
  materials.lithium_niobate.n_o: {class: standard_reference, citation: "Wang et al., Nature 629, 784 (2024), Extended Data Table 1 (references/wang2024b/text.md p.15, table image img_p15_1.png), 1550 nm", note: "2.21; paper states no LN indices"}
  materials.lithium_niobate.n_e: {class: standard_reference, citation: "Wang et al., Nature 629, 784 (2024), Extended Data Table 1 (references/wang2024b/text.md p.15, table image img_p15_1.png), 1550 nm", note: "2.14"}
  materials.lithium_niobate.eps_r: {class: standard_reference, citation: "Wang et al., Nature 629, 784 (2024), Extended Data Table 1 (references/wang2024b/text.md p.15, table image img_p15_1.png), 1550 nm, 100 kHz", note: "eps_11,22 = 38, eps_33 = 28; low-frequency permittivity, not at mm-wave; paper states none"}
  materials.lithium_niobate.r_pm_per_v: {class: standard_reference, citation: "Wang et al., Nature 629, 784 (2024), Extended Data Table 1 (references/wang2024b/text.md p.15, table image img_p15_1.png), 1550 nm", note: "r33 = 30.9, r51 = 32.6 only; r13 and r22 not given there and left out (see missing)"}
  materials.silicon_dioxide.n: {class: standard_reference, citation: "Mao et al., APL Photon. 7, 126103 (2022) (references/mao2022/text.md p.3, printed 126103-2: nSiO2 = 1.444)", note: "the paper gives no SiO2 index"}
  materials.silicon_dioxide.eps_r: {class: paper_exact, locator: "p.2 Sec. 2 (SiO2 eps about 3.9)"}
  materials.silicon.eps_r: {class: paper_exact, locator: "p.2 Sec. 2 (Si eps about 11.9)"}
  materials.silicon.n: {class: standard_reference, citation: "Mao et al., APL Photon. 7, 126103 (2022) (references/mao2022/text.md p.3, printed 126103-2: nSi = 3.475)", note: "outside the optical window, not used by the solve"}
  materials.gold.sigma_Sm: {class: unknown, note: "UNVERIFIED placeholder 4.1e7 S/m (no source read); the paper does not state the film conductivity"}
  line.length_mm: {class: paper_exact, locator: "p.2 Sec. 2; p.4 (5 mm long device)"}
  line.source_ohm: {class: project_inference, note: "VNA ports assumed 50 ohm; paper designs the tapers for Z0 = 50 ohm (p.3)"}
  line.load_ohm: {class: paper_exact, locator: "p.4 (external 50 ohm load through a 110 GHz probe)"}
  line.differential: {class: project_inference, note: "G-S-G with signal on the centre line and one waveguide in each gap; single-ended drive, push-pull by geometry (p.2 states push-pull)"}
  line.conductor_loss_model: {class: project_inference, note: "paper gives only simulated alpha maps (Fig. 3(a)); model choice left to the engine"}
  geometry.regions.substrate: {class: paper_exact, locator: "p.2 Sec. 2 (525 um Si; region clipped to the domain)"}
  geometry.regions.box: {class: paper_exact, locator: "p.2 Sec. 2 (4.7 um thermal SiO2)"}
  geometry.regions.ln_slab: {class: paper_exact, locator: "p.2 Sec. 2 (600 nm film, 200 nm ridge height)", note: "slab 400 nm = 600 - 200"}
  geometry.regions.sio2_cladding: {class: project_inference, locator: "p.2-3 (1 um PECVD SiO2 cladding)", note: "taken as a flat 1 um layer above the slab surface, covering the 200 nm ridge and embedding the 830 nm electrodes; conformal deposition over the electrodes would differ"}
  geometry.regions.ln_rib_r: {class: project_inference, locator: "p.2 Sec. 2 (1.3 um wide); p.3 Fig. 4(b) (sidewall nearly 90 deg)", note: "rectangular 1.3 um ridge; the 20 deg bottom slope on one side (SEM) and the mask-width compensation are not modelled"}
  geometry.regions.ln_rib_l: {class: project_inference, note: "mirror image of the right-hand ridge about the signal centre"}
  geometry.electrodes.signal: {class: paper_exact, locator: "p.2 Sec. 2 (W = 20 um, T = 830 nm); p.3 (50 nm Ti + 780 nm Au)", note: "edge at 3.5 um from the waveguide axis (G = 7 um, waveguide assumed centred); Ti adhesion layer merged into the gold"}
  geometry.electrodes.ground_r: {class: project_inference, note: "ground width not stated; taken equal to the signal width (20 um), inner edge G/2 = 3.5 um from the waveguide axis"}
  geometry.electrodes.ground_l: {class: project_inference, note: "mirror of ground_r"}
  geometry.optical_window: {class: project_inference, note: "crop |x| < 3.0 um, inside the electrode edge at 3.5 um"}
  geometry.domain: {class: project_inference, note: "lateral extent and vertical -250..120 um; open-boundary treatment is an engine choice"}
  geometry.mesh: {class: project_inference}

missing:
  - ground electrode width (not stated; taken equal to the signal width)
  - waveguide position inside the 7 um gap (assumed centred)
  - fabricated ridge width and sidewall profile beyond "nearly 90 deg" (bottom slope of about 20 deg on one side)
  - SiO2 cladding profile (flat versus conformal)
  - LN refractive indices, RF permittivity and r13/r22 (not given; standard_reference values from another paper)
  - gold film conductivity (4.1e7 S/m is an UNVERIFIED placeholder)
  - measurement wavelength of Vpi and EO S21; temperature
  - source impedance of the VNA
limitations:
  - scalar_optical_not_full_vector
  - quasi_static_2d_rf
  - rectangular_or_polygon_sidewalls_only
  - no_3d_launch_pad_effects
  - "Electrode tapers (100 um straight), bends and pads are not modelled"
  - "Ti adhesion layer merged into the gold; lossless silicon (resistivity not stated)"
  - "The ridge profile is idealized as rectangular"
