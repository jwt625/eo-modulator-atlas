# Coordinate frame: x lateral, y film normal up, z propagation; x = 0 at the centre of arm A (right rib); y = 0 at the BOX top / LN slab bottom.
# Push-pull G-S-G CPW (p.2): signal electrode left of arm A, arm B in the left gap (mirror about the signal centre). Source: Nature Communications 14, 1496.
# Geometry is generated by the tfln_rib_gsg template from `params` (DevLog-026). Before 2026-10-14 the config held one gap only
# (signal on +x, ground on -x) and did not parse (no RF permittivity); see DevLog-026 for the change list.

schema: eo-atlas.sim/v1
id: renaud2023-3um-738
paper_id: renaud2023
device_id: renaud2023-3um-738
title: Renaud 2023, 1 cm visible-NIR TFLN MZM, 3 um gap, 738 nm, push-pull G-S-G cross-section
repro_grade: B
validation_status: unvalidated
chain: [electrostatics, optical_mode, eo_overlap, rf_line, eo_response]

params:
  wavelength_nm: {value: 738, unit: nm, description: optical wavelength}
  film_um: {value: 0.3, unit: um, description: X-cut LN film thickness}
  etch_um: {value: 0.18, unit: um, description: rib etch depth}
  rib_top_um: {value: 0.6, unit: um, description: rib top width in the electrode region}
  sidewall_deg: {value: 90, unit: deg, description: sidewall angle from horizontal (not stated; vertical used)}
  box_um: {value: 2.0, unit: um, description: thermal SiO2 BOX thickness}
  substrate_um: {value: 58, unit: um, description: Si substrate kept in the model (truncated)}
  cladding_um: {value: 1.0, unit: um, description: PECVD SiO2 cladding above the film (rib) top}
  gap_um: {value: 3.0, unit: um, description: electrode gap (edge to edge)}
  signal_w_um: {value: 50, unit: um, description: signal electrode width (not stated; assumed)}
  ground_w_um: {value: 50, unit: um, description: ground electrode width (not stated; assumed)}
  metal_um: {value: 0.8, unit: um, description: Au electrode thickness}
  margin_um: {value: 48.5, unit: um, description: lateral domain margin outside the grounds (numerical)}
  air_um: {value: 4.7, unit: um, description: air above the cladding top (numerical)}

optics:
  wavelength_nm: "=wavelength_nm"
  polarization: TE
  mode_index: 0
  group_index_from: perturbation
  ng_fixed: null
  eo_axis: auto
  eo: {arm_drive: two_arm_field_resolved, terminal_drive: single_ended}   # arm windows generated by the template

materials:
  lithium_niobate:
    library: lithium_niobate_congruent
    crystal: {cut: x, propagation: y}
  silicon_dioxide: {library: silicon_dioxide}
  silicon: {library: silicon}
  gold: {library: gold_bulk_293k, n_complex: null}
  air: {n: 1.0, eps_r: 1.0}

template:
  type: tfln_rib_gsg
  materials: {film: lithium_niobate, box: silicon_dioxide, substrate: silicon, ambient: air, cladding: silicon_dioxide, electrode: gold}
  film_thickness_um: "=film_um"
  etch_depth_um: "=etch_um"
  rib_top_width_um: "=rib_top_um"
  sidewall_angle_deg: "=sidewall_deg"
  box_thickness_um: "=box_um"
  substrate_thickness_um: "=substrate_um"
  cladding: {thickness_um: "=cladding_um", from: film_top}
  electrodes: {placement: on_slab, gap_um: "=gap_um", signal_width_um: "=signal_w_um", ground_width_um: "=ground_w_um", thickness_um: "=metal_um"}
  arms: push_pull
  domain: {margin_x_um: "=margin_um", air_above_um: "=air_um"}
  mesh: {max_edge_um: 2.0, electrode_edge_um: 0.04}

line:
  length_mm: 10
  conductor_loss_model: from_paper_alpha
  rf_loss_law: {alpha0_db_per_cm_per_sqrt_ghz: 1.35}
  source_ohm: 50
  load_ohm: 50
  differential: false
  loading: {type: none}
sweep: {f_start_ghz: 0.1, f_stop_ghz: 50, n_points: 100}
alt_geometries: {}

targets:
- {metric: vpi_l_dc_vcm, value: 0.55, tol_rel: 0.1, vpi_convention: mzm_push_pull, source: {drive_frequency_hz: 1000000, drive_locator: "p.5 Methods (1 MHz triangle waveform); Fig. 2 caption p.3 (1 MHz)", device_id: renaud2023-3um-738, field: vpil_dc_vcm}}
- {metric: vpi_dc_v, value: 0.55, tol_rel: 0.1, vpi_convention: mzm_push_pull, source: {drive_frequency_hz: 1000000, drive_locator: "p.5 Methods (1 MHz triangle waveform); Fig. 2 caption p.3 (1 MHz)", device_id: renaud2023-3um-738, field: vpi_dc_v, note: "measured at 1 MHz (Methods p.5), 1 cm"}}
- {metric: n_rf, at_ghz: 50, value: 2.22, tol_abs: 0.05, source: {device_id: renaud2023-3um-738, field: n_rf, note: "paper COMSOL simulation"}}
- {metric: ng_opt, value: 2.38, tol_abs: 0.05, source: {device_id: renaud2023-3um-738, field: ng_opt}}
- {metric: z0_ohm, value: 50, tol_abs: 5.0, source: {paper_id: renaud2023, locator: "p.2 (electrodes designed with COMSOL for an impedance close to 50 ohm)", basis: design_intent, comparable: false, note: "design intent, not a reported value (data/devices.csv z0_ohm is empty for every renaud2023 row); signal and ground widths are not stated and 50 um is assumed here (audit A3, 2026-10-15)"}}
- {metric: bw3db_ghz, value: 35, tol_rel: 0.15, reference_ghz: 3, source: {device_id: renaud2023-3um-738, field: bw3db_ghz}}
reported_curves: []

studies:
  gap:
    type: parametric
    description: Vpi vs electrode gap at 738 nm, 1 cm push-pull MZMs (Fig. 2(b))
    stages: [electrostatics, optical_mode, eo_overlap]
    sweep: [{param: gap_um, values: [2.5, 3.0, 4.0, 5.0]}]
    outputs: [vpi_dc_v, vpi_l_dc_vcm, n_eff, ng_opt, n_rf, z0_ohm]
    sweep_targets:
    - {at: {gap_um: 2.5}, metric: vpi_dc_v, value: 0.47, tol_rel: 0.15, vpi_convention: mzm_push_pull, source: {drive_frequency_hz: 1000000, drive_locator: "p.5 Methods (1 MHz triangle waveform); Fig. 2 caption p.3 (1 MHz)", device_id: renaud2023-2p5um-738, field: vpi_dc_v, note: "read from Fig. 2(b) (about +-0.02 V)"}}
    - {at: {gap_um: 3.0}, metric: vpi_dc_v, value: 0.55, tol_rel: 0.15, vpi_convention: mzm_push_pull, source: {drive_frequency_hz: 1000000, drive_locator: "p.5 Methods (1 MHz triangle waveform); Fig. 2 caption p.3 (1 MHz)", device_id: renaud2023-3um-738, field: vpi_dc_v}}
    - {at: {gap_um: 4.0}, metric: vpi_dc_v, value: 0.79, tol_rel: 0.15, vpi_convention: mzm_push_pull, source: {drive_frequency_hz: 1000000, drive_locator: "p.5 Methods (1 MHz triangle waveform); Fig. 2 caption p.3 (1 MHz)", device_id: renaud2023-4um-738, field: vpi_dc_v, note: "read from Fig. 2(b)"}}
    - {at: {gap_um: 5.0}, metric: vpi_dc_v, value: 0.93, tol_rel: 0.15, vpi_convention: mzm_push_pull, source: {drive_frequency_hz: 1000000, drive_locator: "p.5 Methods (1 MHz triangle waveform); Fig. 2 caption p.3 (1 MHz)", device_id: renaud2023-5um-738, field: vpi_dc_v, note: "read from Fig. 2(b)"}}
  wavelength:
    type: parametric
    description: Vpi vs wavelength of one 1 cm, 3 um gap push-pull MZM (Fig. 2(a))
    stages: [electrostatics, optical_mode, eo_overlap]
    sweep: [{param: wavelength_nm, values: [532, 638, 738, 838, 938]}]
    outputs: [vpi_dc_v, vpi_l_dc_vcm, n_eff, ng_opt]
    sweep_targets:
    - {at: {wavelength_nm: 532}, metric: vpi_dc_v, value: 0.42, tol_rel: 0.15, vpi_convention: mzm_push_pull, source: {drive_frequency_hz: 1000000, drive_locator: "p.5 Methods (1 MHz triangle waveform); Fig. 2 caption p.3 (1 MHz)", device_id: renaud2023-3um-532, field: vpi_dc_v}}
    - {at: {wavelength_nm: 638}, metric: vpi_dc_v, value: 0.45, tol_rel: 0.15, vpi_convention: mzm_push_pull, source: {drive_frequency_hz: 1000000, drive_locator: "p.5 Methods (1 MHz triangle waveform); Fig. 2 caption p.3 (1 MHz)", device_id: renaud2023-3um-638, field: vpi_dc_v, note: "text value; Fig. 2(a) point about 0.47 V"}}
    - {at: {wavelength_nm: 738}, metric: vpi_dc_v, value: 0.55, tol_rel: 0.15, vpi_convention: mzm_push_pull, source: {drive_frequency_hz: 1000000, drive_locator: "p.5 Methods (1 MHz triangle waveform); Fig. 2 caption p.3 (1 MHz)", device_id: renaud2023-3um-738, field: vpi_dc_v}}
    - {at: {wavelength_nm: 838}, metric: vpi_dc_v, value: 0.85, tol_rel: 0.15, vpi_convention: mzm_push_pull, source: {drive_frequency_hz: 1000000, drive_locator: "p.5 Methods (1 MHz triangle waveform); Fig. 2 caption p.3 (1 MHz)", device_id: renaud2023-3um-838, field: vpi_dc_v, note: "text value; Fig. 2(a) point about 0.81 V"}}
    - {at: {wavelength_nm: 938}, metric: vpi_dc_v, value: 0.80, tol_rel: 0.15, vpi_convention: mzm_push_pull, source: {drive_frequency_hz: 1000000, drive_locator: "p.5 Methods (1 MHz triangle waveform); Fig. 2 caption p.3 (1 MHz)", device_id: renaud2023-3um-938, field: vpi_dc_v, note: "read from Fig. 2(a)"}}
  sidewall:
    type: parametric
    description: rib sidewall angle 60-90 deg from horizontal (Fig. 1(c) draws sloped walls; the angle is not stated), 3 um gap, 738 nm
    stages: [electrostatics, optical_mode, eo_overlap]
    sweep: [{param: sidewall_deg, values: [60, 70, 80, 90]}]
    outputs: [vpi_dc_v, vpi_l_dc_vcm, n_eff]

provenance:
  params.wavelength_nm: {class: paper_exact, locator: p.1 abstract; p.2}
  optics.polarization: {class: project_inference, locator: p.2 (TE00 and TM00 supported at 740 nm), note: TE assumed for the x-cut r33 interaction; polarization of the modulator measurement not stated}
  optics.group_index_from: {class: project_inference, note: "engine derives the group index; changed 2026-10-15 from finite_difference_wavelength (written when it was the only computed group index, meaning computed by the model, not fixed) to perturbation, the engine default; FD stays selectable (DevLog-026 round 4)"}
  optics.eo: {class: project_inference, locator: "p.2 (push-pull CPW travelling-wave electrodes)", note: "arm windows generated by the template on both ribs; single-ended G-S-G drive"}
  materials.lithium_niobate: {class: standard_reference, citation: "engine/data/materials.json library lithium_niobate_congruent (optical: Zelmon et al. 1997; eps_r: Weis and Gaylord, Appl. Phys. A 37, 191 (1985), Table 1 p.197 row [23] eps^S, clamped; r: Weis and Gaylord 1985 Table 4 p.199 r^S 633 nm row [45], clamped)", note: "the paper states no LN constants"}
  materials.lithium_niobate.crystal: {class: paper_exact, locator: p.2 (X-cut TFLN), note: propagation along y assumed}
  materials.silicon_dioxide: {class: standard_reference, citation: "engine/data/materials.json library silicon_dioxide (optical: Malitson 1965; eps_r 3.9: Zhu et al. 2021 Table 1)", note: "used for both the thermal BOX and the PECVD cladding"}
  materials.silicon: {class: standard_reference, citation: "engine/data/materials.json library silicon (eps_r 11.7: Zhu et al. 2021 Table 1)"}
  materials.gold: {class: standard_reference, citation: "engine/data/materials.json library gold_bulk_293k (Matula 1979)", note: "conductivity unused by from_paper_alpha"}
  params.film_um: {class: paper_exact, locator: 'p.2 Fig. 1(c) (300 nm film)'}
  params.etch_um: {class: paper_exact, locator: 'p.2 Fig. 1(c); p.5 Methods (180 nm etch, 120 nm slab)'}
  params.rib_top_um: {class: paper_exact, locator: p.2 Fig. 1(c) (600 nm top width in the electrode region)}
  params.sidewall_deg: {class: unknown, note: sidewall angle not stated; vertical walls used (rectangular approximation, as before 2026-10-14)}
  params.box_um: {class: paper_exact, locator: p.2 (2 um thermally grown SiO2)}
  params.substrate_um: {class: project_inference, note: 'Si substrate thickness not stated; region truncated at y = -60 um'}
  params.cladding_um: {class: paper_exact, locator: p.2 Fig. 1(c); p.5 Methods (about 1 um PECVD), note: "cladding top taken at film (rib) top + 1 um (y = 1.3 um, as in the previous config); reference surface not stated"}
  params.gap_um: {class: paper_exact, locator: 'p.2; Fig. 2 caption (3 um gap)'}
  params.signal_w_um: {class: project_inference, note: signal width not stated; 50 um assumed (unchanged from the previous config)}
  params.ground_w_um: {class: project_inference, note: ground width not stated; 50 um assumed}
  params.metal_um: {class: paper_exact, locator: p.5 Methods (Ti/Au about 10/800 nm), note: Ti 10 nm not modelled}
  template.electrodes.placement: {class: figure_digitized, locator: 'p.2 Fig. 1(c)', note: "electrodes resting on the slab with the waveguide centred in each gap; whether they contact the LN through a cladding opening (Methods: RIE before evaporation) or sit on the cladding is not stated"}
  line.length_mm: {class: paper_exact, locator: p.2 (1 cm long MZMs)}
  line.load_ohm: {class: paper_exact, locator: p.3 Fig. 2(a) setup (50 ohm termination)}
  line.source_ohm: {class: paper_exact, locator: p.5 Methods (50 ohm GSG probes)}
  line.differential: {class: project_inference, locator: p.2, note: 'push-pull stated; single-ended GSG feed'}
  line.conductor_loss_model: {class: project_inference, locator: p.3, note: "total RF loss taken from the paper's fitted coefficient (input, not a prediction)"}
  line.rf_loss_law: {class: paper_exact, locator: "p.3 (RF loss of the CPW, 1.35 dB cm^-1 GHz^-1/2)"}
  template.domain: {class: project_inference, note: open-boundary treatment is an engine choice}
  template.mesh: {class: project_inference}
  studies.sidewall: {class: project_inference, locator: "p.2 Fig. 1(c) (trapezoidal ribs drawn, angle not stated); p.5 Methods (Ar+ RIE)", note: "sensitivity study (DevLog-029 proposal 4); no measured target"}
  studies.gap: {class: paper_exact, locator: "p.2 Fig. 2(b); devices rows renaud2023-{2p5um,3um,4um,5um}-738", note: "2.5, 4 and 5 um values read from the plot (about +-0.02 V)"}
  studies.wavelength: {class: paper_exact, locator: "p.2 text and Fig. 2(a); devices rows renaud2023-3um-{532,638,738,838,938}", note: "938 nm read from the plot"}
missing:
  - signal and ground electrode widths (50 um assumed)
  - rib sidewall angle (vertical used)
  - whether the electrodes contact the LN slab through an opening in the cladding (Methods RIE before evaporation) or sit on the cladding (on the slab used)
  - reference surface of the about 1 um cladding
  - LN, SiO2 and Si constants (not stated; engine library values used)
  - wavelength dependence of the Pockels coefficients (library values are wavelength-unstated clamped values)
  - which wavelength the 0.7 dB/cm optical loss and the 15 dB total insertion loss refer to
  - temperature
limitations:
  - "Electrode gap tapers along the probe contact region (Fig. 1(d) caption; about 0.8 mm per end measured on the 5 mm device in DevLog-029) lengthen the effective modulated length: reader estimate +3 to +8 % on the 1 cm device, not an engine run"
  - "The paper's two theory curves disagree by about 6 % at 3 um / 738 nm (0.552 vs 0.587 V, digitized in DevLog-029)"
  - "Vpi measured at 1 MHz (Methods p.5) is compared with clamped Pockels constants; result.targets[].lowFrequencyRange gives the r33-scaled unclamped estimate"
  - quasi_static_2d_rf
  - rectangular_or_polygon_sidewalls_only
  - no_3d_launch_pad_effects
  - "The 50 GHz RF index target is a paper simulation (COMSOL), not a measurement; with from_paper_alpha it is not evaluated"
  - "The 3 dB bandwidth is referenced to 3 GHz, not to DC; the engine reference convention is not defined for this"
  - "Higher-order optical modes at shorter wavelengths (noted by the authors) are outside the scalar single-mode model; mode_index 0 is used at every wavelength"
  - "Vpi measured at 1 MHz is compared with the clamped (high-frequency) library Pockels coefficients"
  - "The gap sweep moves the grounds and arm B with the gap (signal and ground widths fixed); the wavelength sweep keeps the geometry"
