# Coordinate frame: x lateral, y film normal up, z propagation. y = 0 at the BOX top / LN bottom.
# Origin: optical axis of the RIGHT-hand waveguide in x; mirror plane (signal centre) at x = -11.75 um; LEFT waveguide at x = -23.5 um.
# Both arms are in the electrostatic domain (symmetry none); the optical mode is solved on the right arm.
# Geometry values are the designed parameters of p.3 (g, ws, wg, t, w, h); fabricated values are not reported.
schema: eo-atlas.sim/v1
id: pan2021-a
paper_id: pan2021
device_id: pan2021-a
title: Pan 2021, 5 mm 1957 nm TFLN MZM on silicon (GSG traveling-wave electrode, push-pull arms), designed parameters
repro_grade: A
validation_status: unvalidated
chain: [electrostatics, optical_mode, eo_overlap, rf_line, eo_response]
optics: {wavelength_nm: 1957, polarization: TE, mode_index: 0, group_index_from: finite_difference_wavelength, ng_fixed: null, eo_axis: auto}
materials:
