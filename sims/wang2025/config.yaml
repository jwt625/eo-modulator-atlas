schema: eo-atlas.sim/v1
id: wang2025-a
paper_id: wang2025
device_id: wang2025-a
title: Wang 2025, 7 mm periodic T-rail CLTW TFLT MZM on silicon with backside holes (G-S-G, push-pull arms), loaded cross-section
repro_grade: B
validation_status: unvalidated
chain: [electrostatics, optical_mode, eo_overlap, rf_line, loaded_line, eo_response]

# Coordinate frame: x lateral (paper Z-ish), y film normal up, z propagation. y = 0 at the BOX top / LT bottom.
# Origin: optical axis of the RIGHT-hand waveguide in x. Signal electrode centre (mirror plane) at x = -58.2 um; LEFT waveguide at x = -116.4 um.
# Both arms are in the electrostatic domain (symmetry none); the optical mode is solved on the right arm.
# Layout follows the same group's chen2022 CLTW design: T-bars (c = 2 um wide) either side of a j = 1.8 um gap, stems of length a = 15.3 um to the unloaded electrodes.
# Crystal: the device is X-112 deg Y (propagation 22 deg from Y toward Z); this config uses x-cut propagating along y, which matches the paper's own
# simulation of V_pi L along the Y axis (2.41 V cm). The rotated cut is NOT representable (see limitations and SPEC_PROPOSALS).
optics:
  wavelength_nm: 1550
  polarization: TE
  mode_index: 0
  group_index_from: finite_difference_wavelength
  ng_fixed: null
  eo_axis: auto

materials:
  lithium_tantalate:
    crystal: {cut: x, propagation: y}
    n_o: 2.119
    n_e: 2.123
    eps_r: {perp: 54.0, par: 43.0}
    r_pm_per_v: {r33: 30.5, r51: 20.0}
  silicon_dioxide: {n: 1.444, eps_r: 3.9}
  silicon: {n: 3.476, eps_r: 11.7}
  gold: {conductor: true, sigma_Sm: 4.1e7, n_complex: null}
  air: {n: 1.0, eps_r: 1.0}

geometry:                          # LOADED cross-section (T-bars present, backside holes under both waveguides)
  symmetry: none
  domain: {x_um: [-330, 210], y_um: [-260, 120]}
  regions:
    - {name: ambient, material: air, rect: {x_um: [-330, 210], y_um: [-260, 120]}}
    - {name: substrate, material: silicon, rect: {x_um: [-330, 210], y_um: [-254.7, -4.7]}}
    - {name: hole_r, material: air, rect: {x_um: [-45, 45], y_um: [-254.7, -4.7]}}
    - {name: hole_l, material: air, rect: {x_um: [-161.4, -71.4], y_um: [-254.7, -4.7]}}
    - {name: box, material: silicon_dioxide, rect: {x_um: [-330, 210], y_um: [-4.7, 0]}}
    - {name: lt_slab, material: lithium_tantalate, rect: {x_um: [-330, 210], y_um: [0, 0.2]}}
    - {name: sio2_cladding, material: silicon_dioxide, rect: {x_um: [-330, 210], y_um: [0.2, 1.1]}}
    - {name: lt_rib_r, material: lithium_tantalate, polygon_um: [[-0.8655, 0.2], [0.8655, 0.2], [0.75, 0.4], [-0.75, 0.4]]}
    - {name: lt_rib_l, material: lithium_tantalate, polygon_um: [[-117.2655, 0.2], [-115.5345, 0.2], [-115.65, 0.4], [-117.15, 0.4]]}
  electrodes:
    - {name: signal, role: signal, weight: 1.0, rect: {x_um: [-98.2, -18.2], y_um: [1.1, 2.2]}, material: gold}
    - {name: ground_r, role: ground, weight: 0.0, rect: {x_um: [18.2, 118.2], y_um: [1.1, 2.2]}, material: gold}
    - {name: ground_l, role: ground, weight: 0.0, rect: {x_um: [-234.6, -134.6], y_um: [1.1, 2.2]}, material: gold}
    - {name: pad_r_signal_side, role: signal, weight: 1.0, rect: {x_um: [-2.9, -0.9], y_um: [1.1, 1.3]}, material: gold}
    - {name: pad_r_ground_side, role: ground, weight: 0.0, rect: {x_um: [0.9, 2.9], y_um: [1.1, 1.3]}, material: gold}
    - {name: pad_l_signal_side, role: signal, weight: 1.0, rect: {x_um: [-115.5, -113.5], y_um: [1.1, 1.3]}, material: gold}
    - {name: pad_l_ground_side, role: ground, weight: 0.0, rect: {x_um: [-119.3, -117.3], y_um: [1.1, 1.3]}, material: gold}
  optical_window: {x_um: [-4, 4], y_um: [-1.5, 1.05]}
  mesh: {max_edge_um: 2.0, electrode_edge_um: 0.05}
line:
  length_mm: 7
  conductor_loss_model: skin_effect_wheeler
  rf_loss_table: null
  source_ohm: 50
  load_ohm: 50
  differential: false              # single-ended G-S-G probe on the centre line; push-pull arises from the arm placement
  loading:
    type: periodic_t_rail
    period_um: 50                  # d + b = 47 + 3; project_inference, see provenance
    loaded_length_um: 47           # T-bar length d; see provenance
    unloaded_cross_section: unloaded
    loaded_cross_section: null     # null = top-level `geometry`
sweep: {f_start_ghz: 0.1, f_stop_ghz: 67, n_points: 134}

alt_geometries:
  unloaded:                        # UNLOADED cut: T-bar pads absent (gap b between T-segments); holes and cladding unchanged
    symmetry: none
    domain: {x_um: [-330, 210], y_um: [-260, 120]}
    regions:
      - {name: ambient, material: air, rect: {x_um: [-330, 210], y_um: [-260, 120]}}
      - {name: substrate, material: silicon, rect: {x_um: [-330, 210], y_um: [-254.7, -4.7]}}
      - {name: hole_r, material: air, rect: {x_um: [-45, 45], y_um: [-254.7, -4.7]}}
      - {name: hole_l, material: air, rect: {x_um: [-161.4, -71.4], y_um: [-254.7, -4.7]}}
      - {name: box, material: silicon_dioxide, rect: {x_um: [-330, 210], y_um: [-4.7, 0]}}
      - {name: lt_slab, material: lithium_tantalate, rect: {x_um: [-330, 210], y_um: [0, 0.2]}}
      - {name: sio2_cladding, material: silicon_dioxide, rect: {x_um: [-330, 210], y_um: [0.2, 1.1]}}
      - {name: lt_rib_r, material: lithium_tantalate, polygon_um: [[-0.8655, 0.2], [0.8655, 0.2], [0.75, 0.4], [-0.75, 0.4]]}
      - {name: lt_rib_l, material: lithium_tantalate, polygon_um: [[-117.2655, 0.2], [-115.5345, 0.2], [-115.65, 0.4], [-117.15, 0.4]]}
    electrodes:
      - {name: signal, role: signal, weight: 1.0, rect: {x_um: [-98.2, -18.2], y_um: [1.1, 2.2]}, material: gold}
      - {name: ground_r, role: ground, weight: 0.0, rect: {x_um: [18.2, 118.2], y_um: [1.1, 2.2]}, material: gold}
      - {name: ground_l, role: ground, weight: 0.0, rect: {x_um: [-234.6, -134.6], y_um: [1.1, 2.2]}, material: gold}
    optical_window: {x_um: [-4, 4], y_um: [-1.5, 1.05]}
    mesh: {max_edge_um: 2.0, electrode_edge_um: 0.05}
targets:
  # Paper's own simulation along the Y axis (matches this config's crystal frame); compare as cross-solver reference
  - {metric: vpi_l_dc_vcm, value: 2.41, tol_rel: 0.10, source: {paper_id: wang2025, locator: "p.2 Design text; Fig. 2(a)", basis: simulated, note: "1550 nm, waveguide along Y, TE00, at 100 GHz setup"}}
  - {metric: vpi_l_dc_vcm, value: 2.67, tol_rel: 0.15, source: {paper_id: wang2025, locator: "p.3 Measurement text", basis: derived, note: "authors state 2.67 V cm for propagation exactly along Y (p.3); equals their measured 3.22 V cm x the 0.83 orientation factor (p.2); derivation not shown by the authors"}}
  - {metric: ng_opt, value: 2.19, tol_abs: 0.05, source: {device_id: wang2025-a, field: ng_opt, basis: simulated, note: "paper's own simulated group index"}}
  - {metric: z0_ohm, value: 50, tol_abs: 3.0, source: {paper_id: wang2025, locator: "p.2 Design text; Fig. 2(c)", basis: design_target, note: "Zc designed to be 50 ohm"}}
  # Measured, 7 mm device (devices.csv row wang2025-a)
  - {metric: vpi_l_dc_vcm, value: 3.22, tol_rel: 0.15, source: {device_id: wang2025-a, field: vpil_dc_vcm, comparable: false, note: "measured along the rotated 112 deg Y axis; NON-COMPARABLE with an x-cut/y-propagation model"}}
  - {metric: n_rf, value: 2.25, tol_abs: 0.05, source: {device_id: wang2025-a, field: n_rf, comparable: false, note: "deduced from measured S-parameters of the fabricated device (residual silicon, hole-width errors); design value is near ng = 2.19"}}
  - {metric: bw3db_ghz, value: 55, tol_rel: 0.15, source: {device_id: wang2025-a, field: bw3db_ghz, comparable: false, note: "authors: around 55 GHz (conclusion: exceeding 55); EO traces first reach -3 dB near 50-51 GHz and oscillate about -3 dB to 63 GHz (Fig. 4(c), approx. reading); not an engine-evaluated crossing"}}
reported_curves: []

provenance:
  optics.wavelength_nm: {class: paper_exact, locator: "p.2 Design text (simulated at 1550 nm)", note: "measurement wavelength is not stated"}
  optics.polarization: {class: paper_exact, locator: "p.2 Design text; p.2 Measurement text (fundamental TE mode)"}
  optics.group_index_from: {class: project_inference, note: "paper quotes simulated ng = 2.19 (Fig. 2d); engine derives it by finite difference and compares as a target"}
  materials.lithium_tantalate.crystal: {class: project_inference, locator: "p.2 Design text (X-112 deg Y cut; waveguide along the 112 deg Y axis)", note: "x-cut with propagation along y is the closest representable frame; real cut is rotated 22 deg, EO efficiency 0.83 of optimum per the authors"}
  materials.lithium_tantalate.n_o: {class: standard_reference, citation: "Wang et al., Nature 629, 784 (2024), Extended Data Table 1, 1550 nm", note: "2.119; not stated in wang2025"}
  materials.lithium_tantalate.n_e: {class: standard_reference, citation: "Wang et al., Nature 629, 784 (2024), Extended Data Table 1, 1550 nm", note: "2.123"}
  materials.lithium_tantalate.eps_r: {class: standard_reference, citation: "Wang et al., Nature 629, 784 (2024), Extended Data Table 1, 100 kHz", note: "eps_11,22 = 54 (perp), eps_33 = 43 (par); 100 kHz values, rotated cut ignored"}
  materials.lithium_tantalate.r_pm_per_v: {class: standard_reference, citation: "r33 = 30.5 pm/V quoted on p.2 of wang2025; r51 = 20 pm/V from Wang et al., Nature 629, 784 (2024), Extended Data Table 1", note: "r13 and r22 not available and left out (see missing)"}
  materials.silicon_dioxide: {class: standard_reference, citation: "standard handbook values (n = 1.444 at 1550 nm, eps_r = 3.9); paper states neither"}
  materials.silicon.eps_r: {class: standard_reference, citation: "standard handbook value 11.7; paper states no silicon constants"}
  materials.gold.sigma_Sm: {class: standard_reference, citation: "bulk gold 4.1e7 S/m; film conductivity not stated (p.3 blames nonideal metal deposition for excess loss)"}
  materials.air: {class: standard_reference, citation: "vacuum-like ambient n = 1, eps_r = 1"}
  line.length_mm: {class: paper_exact, locator: "p.2 Measurement text (L = 0.7 cm)"}
  line.source_ohm: {class: paper_exact, locator: "p.4 Fig. 3(h) caption (source/load impedance 50 ohm); p.3 Fig. 2 caption (simulation); p.5 Methods (off-chip 50 ohm termination)", note: "captions state source/load impedance 50 ohm; RF amplifier output impedance not stated"}
  line.load_ohm: {class: paper_exact, locator: "p.5 Methods (off-chip 50 ohm termination via second probe)"}
  line.differential: {class: project_inference, note: "G-S-G with one arm per gap (Fig. 1(c)); the paper never says push-pull"}
  line.conductor_loss_model: {class: project_inference, note: "paper reports simulated alpha0 = 0.194 dB/cm/GHz^0.5; loss model left to the engine"}
  line.loading.period_um: {class: project_inference, locator: "p.2 Design text (a, b, c, d, e) = (15.3, 3, 2, 47, 5) um; Fig. 1(a)", note: "period = T-bar length d + gap b = 50 um; the period itself is not stated"}
  line.loading.loaded_length_um: {class: project_inference, locator: "p.2 Design text; Fig. 1(a)", note: "T-bar length d = 47 um; backside holes are continuous so no slot-limited loaded length exists, unlike chen2022"}
  geometry.regions.substrate: {class: paper_exact, locator: "p.5 Methods (thinned to approximately 250 um)", note: "thickness approximate; holes cut through to the BOX"}
  geometry.regions.hole_r: {class: project_inference, locator: "p.2 Design text (r = 90 um); Fig. 1(c); Fig. 3(c)", note: "width r = 90 um from text; centred under the waveguide chosen from Fig. 1(c) (not-to-scale schematic, which also draws the pillar as wide as Ws); waveguide pitch 115 um read on Fig. 3(c) agrees with the 116.4 um implied by the electrodes; fabricated hole width differs (p.3)"}
  geometry.regions.hole_l: {class: project_inference, locator: "Fig. 1(c); Fig. 3(c)", note: "same as hole_r (Fig. 1(c) also draws the pillar as wide as Ws; centring under the waveguide chosen), centred under the left waveguide; leaves a 26.4 um silicon pillar under the signal electrode"}
  geometry.regions.box: {class: paper_exact, locator: "p.2 Design text (4.7 um BOX)"}
  geometry.regions.lt_slab: {class: paper_exact, locator: "p.2 Design text (400 nm film, 200 nm ridge height)", note: "slab 200 nm = 400 - 200, project arithmetic"}
  geometry.regions.sio2_cladding: {class: project_inference, locator: "p.2 Design text (900 nm SiO2); Fig. 1(c)", note: "flat top 0.9 um above the slab assumed; sketch shows a conformal bump over each ridge and is not to scale"}
  geometry.regions.lt_rib_r: {class: project_inference, locator: "p.2 Design text (height 200 nm, width 1.5 um, sidewall 60 deg)", note: "top width 1.5 um assumed (top or bottom not stated); bottom 1.73 um from 60 deg"}
  geometry.regions.lt_rib_l: {class: project_inference, note: "mirror image of the right-hand rib about x = -58.2 um"}
  geometry.electrodes.signal: {class: paper_exact, locator: "p.2 Design text (Ws = 80 um, k = 1.1 um)", note: "inner edge 18.2 um from the waveguide axis = T-bar outer edge 2.9 um + stem length a = 15.3 um"}
  geometry.electrodes.ground_r: {class: figure_digitized, locator: "Fig. 3(c)", note: "ground width not stated; about 100 um read against the 200 um scale bar (+-10%); inner edge at 18.2 um"}
  geometry.electrodes.ground_l: {class: figure_digitized, locator: "Fig. 3(c)", note: "mirror of ground_r"}
  geometry.electrodes.pad_r_signal_side: {class: paper_exact, locator: "p.2 Design text (j = 1.8 um, c = 2 um, l = 200 nm); Fig. 1(a),(c)", note: "bar width c = 2 um and its letter assignment follow the chen2022 design and the Fig. 1(a) sketch; bar joined to the signal electrode by a stem not modelled in 2D"}
  geometry.electrodes.pad_r_ground_side: {class: paper_exact, locator: "p.2 Design text; Fig. 1(c)", note: "see pad_r_signal_side"}
  geometry.electrodes.pad_l_signal_side: {class: project_inference, note: "mirror of the right-hand pads"}
  geometry.electrodes.pad_l_ground_side: {class: project_inference, note: "mirror of the right-hand pads"}
  geometry.optical_window: {class: project_inference, note: "y top at 1.05 um keeps the 0.2 um T-bars (y 1.1..1.3) out of the optical mesh; truncates the cladding above the rib"}
  geometry.domain: {class: project_inference, note: "lateral -330..210 um, vertical -260..120 um"}
  geometry.mesh: {class: project_inference}
  alt_geometries.unloaded: {class: project_inference, locator: "Fig. 1(a),(c)", note: "identical to geometry without the four T-bar pads"}

missing:
  - "measurement wavelength (1550 nm used because the paper simulates at 1550 nm)"
  - "ground electrode widths (about 100 um read from Fig. 3(c))"
  - "whether the 1.5 um ridge width is the top or bottom width"
  - "cladding profile (flat vs conformal) and the reference surface of the 900 nm"
  - "T-segment period and which part of the stem pattern is modelled (50 um period assumed)"
  - "fabricated backside-hole width and sidewall slope (design r = 90 um only)"
  - "residual silicon beneath the electrodes (p.3 reports it; not quantified)"
  - "LT Pockels coefficients r13 and r22 (only r33, r51 available)"
  - "RF permittivity of LT at mm-wave frequencies, RF loss tangents of LT and SiO2, silicon resistivity, gold film conductivity"
  - "temperature"
limitations:
  - scalar_optical_not_full_vector
  - quasi_static_2d_rf
  - rectangular_or_polygon_sidewalls_only
  - no_3d_launch_pad_effects
  - "X-112 deg Y crystal cut (propagation rotated 22 deg from Y toward Z) is not representable: the config uses x-cut/y-propagation, so the permittivity tensor in the cross-section and the EO efficiency (0.83 of optimum per the authors) are not those of the device"
  - "T-bar stems are not representable in a two-cross-section 2D cascade; pads are given electrode potentials directly"
  - "Flat 0.9 um cladding instead of the conformal bump drawn in Fig. 1(c)"
  - "Optical window top at 1.05 um (Dirichlet) crops the cladding above the rib; check boundaryMarginFraction"
  - "Silicon modelled lossless; the residual silicon and substrate loss the authors blame for excess RF loss are absent"
  - "Unloaded cut keeps the holes and cladding; the loaded/unloaded split is a project inference from a schematic"
