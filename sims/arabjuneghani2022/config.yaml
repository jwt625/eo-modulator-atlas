schema: eo-atlas.sim/v1
id: arabjuneghani2022-b
paper_id: arabjuneghani2022
device_id: arabjuneghani2022-b
title: Arab Juneghani 2022, modulator #2, 5 mm uniform TFLN MZM on silicon with off-centre waveguides and SiO2 buffer (G-S-G, push-pull arms)
repro_grade: B
validation_status: unvalidated
chain: [electrostatics, optical_mode, eo_overlap, rf_line, eo_response]

# Conventions follow sims/zhang2022/config.yaml and sims/chen2022/config.yaml.
# Coordinate frame: x lateral, y film normal up, z propagation. y = 0 at the BOX top / LN bottom.
# Origin: optical axis of the RIGHT-hand waveguide in x. Signal electrode (22 um) spans x = -24.4..-2.4 um; LEFT waveguide at x = -26.8 um.
# Each waveguide sits 2.4 um from the signal edge inside the 10 um gap (D = 2.6 um from the gap centre, text definition of D, p.2).
# Both arms are in the electrostatic domain (symmetry none); the optical mode is solved on the right arm.
# Device #1 (arabjuneghani2022-a: G = 5 um, D = 0.6 um, Wc = 12 um) shares the layer stack; only the electrode geometry differs.
params:
  film_um: {value: 0.5, unit: um, description: X-cut LN film thickness}
  etch_um: {value: 0.2, unit: um, description: rib etch depth}
  rib_w_um: {value: 0.8, unit: um, description: rib width (taken as the top width)}
  sidewall_deg: {value: 90, unit: deg, description: sidewall angle from horizontal (not stated; vertical used)}
  box_um: {value: 2.0, unit: um, description: BOX thickness (not stated; placeholder)}
  substrate_um: {value: 248, unit: um, description: Si substrate kept in the model (truncated at the domain bottom)}
  tc_um: {value: 0.8, unit: um, description: SiO2 cladding thickness Tc above the slab top}
  tb_um: {value: 0.2, unit: um, description: SiO2 buffer Tb between slab top and electrode bottom}
  gap_um: {value: 10, unit: um, description: electrode gap G}
  d_um: {value: 2.6, unit: um, description: waveguide offset D from the gap centre toward the signal}
  wc_um: {value: 22, unit: um, description: signal width Wc}
  wg_um: {value: 40, unit: um, description: ground width Wg}
  tg_um: {value: 1.0, unit: um, description: electrode thickness Tg}

optics:
  wavelength_nm: 1550
  polarization: TE
  mode_index: 0
  group_index_from: perturbation
  ng_fixed: null
  eo_axis: auto
  eo: {arm_drive: two_arm_field_resolved, terminal_drive: single_ended}   # arm windows generated by the template (A on the right rib, B mirrored on the left rib)

materials:
  lithium_niobate:
    library: lithium_niobate_congruent   # eps_r 44.0/27.9 (clamped), r13 8.6, r22 3.4, r33 30.8, r51 28.0 (clamped), Zelmon dispersion
    crystal: {cut: x, propagation: y}
  silicon_dioxide: {library: silicon_dioxide}
  silicon: {library: silicon}
  gold: {library: gold_bulk_293k, n_complex: null}
  air: {n: 1.0, eps_r: 1.0}

template:
  type: tfln_rib_gsg
  materials: {film: lithium_niobate, box: silicon_dioxide, substrate: silicon, ambient: air, cladding: silicon_dioxide, electrode: gold}
  film_thickness_um: "=film_um"
  etch_depth_um: "=etch_um"
  rib_top_width_um: "=rib_w_um"
  sidewall_angle_deg: "=sidewall_deg"
  box_thickness_um: "=box_um"
  substrate_thickness_um: "=substrate_um"
  cladding: {thickness_um: "=tc_um", from: slab_top}
  electrodes: {placement: on_buffer, buffer_thickness_um: "=tb_um", gap_um: "=gap_um", signal_width_um: "=wc_um", ground_width_um: "=wg_um", thickness_um: "=tg_um", waveguide_offset_um: "=d_um"}
  arms: push_pull
  domain: {x_um: [-160, 130], y_um: [-250, 60]}
  optical_window: {half_width_um: "=min(2.0, gap_um / 2 - d_um - 0.1)", y_um: [-1.5, 1.5]}   # 2.0 um at the nominal D; clears the signal edge by 0.1 um at large D
  mesh: {max_edge_um: 2.0, electrode_edge_um: 0.05}
line:
  length_mm: 5
  conductor_loss_model: skin_effect_wheeler
  include_internal_inductance: true
  dielectric_loss_model: none
  source_ohm: 50
  load_ohm: 50
  differential: false              # single-ended G-S-G probe on the centre line; push-pull arises from the arm placement (paper states push-pull MZMs, p.2)
  loading: {type: none, period_um: null, loaded_length_um: null, unloaded_cross_section: null, loaded_cross_section: null}
sweep: {f_start_ghz: 0.1, f_stop_ghz: 200, n_points: 200}
alt_geometries: {}

targets:
  # Measured, 5 mm device (devices.csv row arabjuneghani2022-b)
  - {metric: vpi_l_dc_vcm, value: 3.3, tol_rel: 0.15, vpi_convention: mzm_push_pull, source: {device_id: arabjuneghani2022-b, field: vpil_dc_vcm, drive_frequency_hz: 100000, drive_locator: "p.3 (100 kHz triangular voltage sweep)", note: "author-stated product of the measured 6.6 V and 0.5 cm"}}
  - {metric: n_rf, value: 2.2, tol_abs: 0.1, source: {device_id: arabjuneghani2022-b, field: n_rf, note: "extracted from measured S-parameters to 67 GHz"}}
  - {metric: rf_loss_db_per_cm, at_ghz: 67, value: 3.6, tol_rel: 0.2, source: {device_id: arabjuneghani2022-b, field: rf_loss_db_per_cm}}
  - {metric: z0_ohm, value: 50.5, tol_abs: 1.5, source: {paper_id: arabjuneghani2022, locator: "p.3 Sec. 3.2, Fig. 4", basis: derived, note: "paper states Zm in 49-52 ohm over the spectrum; target is the midpoint with a tolerance covering the stated range"}}
  - {metric: eo_rolloff_db, at_ghz: 100, value: -2.0, tol_abs: 0.5, source: {device_id: arabjuneghani2022-b, field: eo_rolloff_db, note: "no devices.csv sign convention: negative here per SPEC"}}
  # Paper-simulated optical group index (Fig. 1(a) inset); compare as cross-solver reference
  - {metric: ng_opt, value: 2.23, tol_abs: 0.05, source: {device_id: arabjuneghani2022-b, field: ng_opt}}
  # Authors' extrapolation beyond the 100 GHz measurement limit, not a measurement
  - {metric: bw3db_ghz, value: 170, tol_rel: 0.2, source: {paper_id: arabjuneghani2022, locator: "p.1 abstract; p.4 Sec. 3.3, Fig. 5(b)", basis: predicted, note: "authors' analytical-model extrapolation beyond the 100 GHz measurement limit; devices.csv holds the measured bound 100 (gt)"}}
reported_curves: []

studies:
  offset_D:
    type: parametric
    description: waveguide offset D from the gap centre (Fig. 3(c), measured Vpi of 5 mm modulators), device #2 electrodes
    stages: [electrostatics, optical_mode, eo_overlap]
    sweep: [{param: d_um, values: [0, 1.0, 2.6, 3.6]}]
    outputs: [vpi_dc_v, vpi_l_dc_vcm, n_eff]
    sweep_targets:
    - {at: {d_um: 0}, metric: vpi_dc_v, value: 12.69, tol_rel: 0.15, vpi_convention: mzm_push_pull, source: {paper_id: arabjuneghani2022, locator: "p.3 Fig. 3(c), digitized in DevLog-029 (+-0.1 V)", basis: extracted_from_figure, drive_frequency_hz: 100000}}
    - {at: {d_um: 1.0}, metric: vpi_dc_v, value: 9.88, tol_rel: 0.15, vpi_convention: mzm_push_pull, source: {paper_id: arabjuneghani2022, locator: "p.3 Fig. 3(c), digitized in DevLog-029 (+-0.1 V)", basis: extracted_from_figure, drive_frequency_hz: 100000}}
    - {at: {d_um: 2.6}, metric: vpi_dc_v, value: 6.69, tol_rel: 0.15, vpi_convention: mzm_push_pull, source: {paper_id: arabjuneghani2022, locator: "p.3 Fig. 3(c), digitized in DevLog-029 (+-0.1 V); devices row arabjuneghani2022-b gives 6.6 V", basis: extracted_from_figure, drive_frequency_hz: 100000}}
    - {at: {d_um: 3.6}, metric: vpi_dc_v, value: 5.08, tol_rel: 0.15, vpi_convention: mzm_push_pull, source: {paper_id: arabjuneghani2022, locator: "p.3 Fig. 3(c), digitized in DevLog-029 (+-0.1 V)", basis: extracted_from_figure, drive_frequency_hz: 100000}}
  device_a:
    type: parametric
    description: modulator #1 (G 5 um, D 0.6 um, Wc 12 um; same stack) as a one-point study
    stages: [electrostatics, optical_mode, eo_overlap]
    sweep: [{param: gap_um, values: [5]}, {param: d_um, values: [0.6]}, {param: wc_um, values: [12]}]
    outputs: [vpi_l_dc_vcm, vpi_dc_v, n_rf, z0_ohm]
    sweep_targets:
    - {at: {gap_um: 5, d_um: 0.6, wc_um: 12}, metric: vpi_l_dc_vcm, value: 2.2, tol_rel: 0.15, vpi_convention: mzm_push_pull, source: {device_id: arabjuneghani2022-a, field: vpil_dc_vcm, drive_frequency_hz: 100000}}

provenance:
  studies.offset_D: {class: figure_digitized, locator: "p.3 Fig. 3(c) measured Vpi vs D at 5 mm: 12.69 / 9.88 / 6.69 / 5.08 V at D = 0 / 1 / 2.6 / 3.6 um, digitized in DevLog-029 (+-0.1 V)", note: "assumes the Fig. 3(c) devices share the device #2 electrodes (G 10 um, Wc 22 um), as read in DevLog-029"}
  studies.device_a: {class: paper_exact, locator: "p.2 Table 1 (modulator #1: G 5 um, D 0.6 um, Wc 12 um); devices row arabjuneghani2022-a (VpiL 2.2 V cm)"}
  template.optical_window: {class: project_inference, note: "half width min(2.0, G/2 - D - 0.1) um: 2.0 um at the nominal D (unchanged), clears the signal edge by 0.1 um at large D"}
  optics.wavelength_nm: {class: paper_exact, locator: "p.4 Sec. 3.3 (EO response at 1550 nm)", note: "wavelength of the Vpi sweep not stated"}
  optics.polarization: {class: project_inference, note: "TE assumed for an x-cut rib with r33 along z; the paper does not state the polarization"}
  optics.group_index_from: {class: project_inference, note: "paper quotes ng = 2.23 (Fig. 1(a) inset, simulated); engine derives it and compares as a target; changed 2026-10-15 from finite_difference_wavelength (written when it was the only computed group index, meaning computed by the model, not fixed) to perturbation, the engine default; FD stays selectable (DevLog-026 round 4)"}
  materials.lithium_niobate.crystal: {class: paper_exact, locator: "p.2 Sec. 2 (X-cut LN)", note: "propagation along crystal y inferred from the axes of Fig. 1 (project_inference)"}
  materials.lithium_niobate: {class: standard_reference, citation: "engine/data/materials.json library lithium_niobate_congruent (optical: Zelmon et al. 1997; eps_r: Zhu et al. 2021 Table 1, clamped; r: Veithen et al. arXiv:cond-mat/0311240 Table I, clamped, citing Rauber 1978)", note: "the paper states no LN constants; replaced unverified placeholders (n 2.211/2.138, eps 43/28, r 8.6/3.4/30.8/28) on 2026-10-14"}
  materials.silicon_dioxide: {class: standard_reference, citation: "engine/data/materials.json library silicon_dioxide (optical: Malitson 1965; eps_r 3.9: Zhu et al. 2021 Table 1)", note: "the paper states neither; replaced the unverified placeholder n = 1.444, eps_r = 3.9 on 2026-10-14"}
  materials.silicon: {class: standard_reference, citation: "engine/data/materials.json library silicon (eps_r 11.7: Zhu et al. 2021 Table 1)", note: "the paper states no silicon constants"}
  materials.gold.sigma_Sm: {class: standard_reference, citation: "engine/data/materials.json library gold_bulk_293k (Matula 1979, Table 5, 293 K)", note: "bulk annealed gold 4.5167e7 S/m; film conductivity not stated and generally lower (was placeholder 4.1e7)"}
  materials.air: {class: standard_reference, citation: "vacuum-like ambient n = 1, eps_r = 1"}
  line.length_mm: {class: paper_exact, locator: "p.2 Table 1 (5000 um); p.3 Fig. 3(b)"}
  line.source_ohm: {class: project_inference, note: "VNA / probe 50 ohm assumed"}
  line.load_ohm: {class: paper_exact, locator: "p.4 Sec. 3.3 (50 ohm termination through a GSG probe)"}
  line.differential: {class: project_inference, locator: "p.2 Sec. 2 (push-pull MZMs), Fig. 1(a)", note: "single-ended G-S-G feed on the centre signal line; arms in opposite fields by geometry"}
  line.include_internal_inductance: {class: project_inference, note: "skin-effect conductor: internal inductance omega L_i = R' included (modelling choice, 2026-10-14)"}
  line.dielectric_loss_model: {class: project_inference, note: "no loss tangent stated; dielectric loss declared none (assumption, see limitations)"}
  optics.eo: {class: project_inference, note: "arm windows from the rib polygons (A = optical_window on the right rib, B mirrored about the signal centre on the left rib); single-ended G-S-G drive"}
  line.conductor_loss_model: {class: project_inference, note: "paper reports alpha_m = 3.6 dB/cm at 67 GHz (0.44 dB/cm/GHz^0.5) from measured S-parameters; loss model left to the engine"}
  params.film_um: {class: paper_exact, locator: "p.2 Sec. 2 (500 nm LN)"}
  params.sidewall_deg: {class: unknown, note: "sidewall angle not stated; vertical walls used"}
  params.gap_um: {class: paper_exact, locator: "p.2 Table 1 (G = 10 um)"}
  params.d_um: {class: paper_exact, locator: "p.2 Sec. 2 and Table 1 (D = 2.6 um from the gap centre, text definition)", note: "waveguide 2.4 um from the signal edge"}
  params.tb_um: {class: paper_exact, locator: "p.2 Table 1 (Tb = 0.2 um)"}
  params.tg_um: {class: paper_exact, locator: "p.2 Table 1 (Tg = 1 um)"}
  params.etch_um: {class: paper_exact, locator: "p.2 Sec. 2 (500 nm LN, 200 nm rib etch)", note: "slab = 500 - 200 = 300 nm is reader arithmetic"}
  params.rib_w_um: {class: project_inference, locator: "p.2 Sec. 2 (800 nm wide, 200 nm high); Fig. 1(a)", note: "width and height from the text; sidewall angle not stated, vertical walls used; width taken as the top width"}
  template.arms: {class: project_inference, note: "same rib 26.8 um to the left, at 2.4 um from the signal edge in the left gap"}
  params.tc_um: {class: figure_digitized, locator: "p.2 Table 1 (Tb = 0.2 um, Tc = 0.8 um), Fig. 1(a)", note: "flat SiO2 top at slab top + Tc = 1.1 um; Tc arrow read as starting at the LN film line in Fig. 1(a); buffer Tb = 0.2 um between LN slab top and electrode bottom"}
  params.substrate_um: {class: paper_exact, locator: "p.2 Fig. 1(a) (silicon)", note: "thickness not stated; region clipped to the domain"}
  params.box_um: {class: unknown, note: "UNVERIFIED placeholder 2 um so the geometry loads; the BOX thickness is not stated in the text or Table 1"}
  template.materials.ambient: {class: project_inference, note: "air above the SiO2 cladding in the gaps; Fig. 1(a) shows no further cladding"}
  params.wc_um: {class: paper_exact, locator: "p.2 Table 1 (Wc = 22 um, Tg = 1 um)", note: "bottom at 0.5 um (slab top + Tb, Fig. 1(a))"}
  params.wg_um: {class: paper_exact, locator: "p.2 Table 1 (Wg = 40 um, G = 10 um)", note: "inner edge G = 10 um from the signal edge"}
  template.electrodes.layout: {class: paper_exact, locator: "p.2 Table 1 (Wg = 40 um, G = 10 um)", note: "mirror of ground_r about the signal centre"}
  template.domain: {class: project_inference, note: "lateral -160..130 um, vertical -250..60 um; open-boundary treatment is an engine choice"}
  template.mesh: {class: project_inference}

missing:
  - "BOX thickness (2 um placeholder)"
  - "rib sidewall angle (vertical walls used) and whether 800 nm is the top or bottom width"
  - "silicon substrate thickness and resistivity"
  - "LN refractive indices, RF permittivity and Pockels coefficients, SiO2 and Si constants, gold film conductivity (not stated; engine library standard values used)"
  - "exact SiO2 cladding profile (flat top assumed) and whether Tc starts at the slab top or the rib top"
  - "polarization of the Vpi and EO measurements"
  - "wavelength of the Vpi sweep"
  - "temperature"
limitations:
  - "Independent reference (L-REF K7, DevLog-028 round 3; same device #2 stack): VpiL(D = 0) / VpiL(D = 3.6 um) = 1.5316 +- 1.5e-4, engine 1.532; the measured Fig. 3(c) ratio is 2.50: the measured D dependence is not reproduced by either solver (study offset_D)"
  - "Vpi measured at 100 kHz (p.3) is compared with clamped Pockels constants; result.targets[].lowFrequencyRange gives the r33-scaled unclamped estimate"
  - quasi_static_2d_rf
  - rectangular_or_polygon_sidewalls_only
  - no_3d_launch_pad_effects
  - "Config is not runnable as a literature comparison until the BOX thickness and material constants are supplied from verified sources"
  - "Only device #2 is configured; device #1 differs in G, D and Wc and needs a separate config"
  - "Fig. 3(c) caption words D as the distance from the signal edge while Sec. 2 and Fig. 1(a) define it from the gap centre; the text definition is used"
  - "Silicon is lossless in the model; the substrate loss that shapes the measured RF loss is not representable without its resistivity"
  - "The 170 GHz bandwidth target is the authors' extrapolation, not a measurement (measured to 100 GHz; the database stores the bound 100 gt)"
  - "Flare-out pads, probe launch and wire effects are not in a static 2D cut"
  - "dielectric_loss_model none is an assumption (no loss tangent stated): the predicted RF attenuation is conductor-only, while the measured 3.6 dB/cm includes substrate and dielectric loss"
  - "LN constants from the engine library (clamped values from secondary open-access compilations); gold is the bulk 293 K value"
