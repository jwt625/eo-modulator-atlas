schema: eo-atlas.sim/v1
id: chen2026-a
paper_id: chen2026
device_id: chen2026-a
title: Chen 2026, 7.5 mm plain CPW TFLT MZM on silicon (6 um gap, 2.2 um ridge, no cladding, push-pull arms)
repro_grade: B
validation_status: unvalidated
chain: [electrostatics, optical_mode, eo_overlap, rf_line, eo_response]

# Conventions follow sims/chen2022/config.yaml.
# Coordinate frame: x lateral, y film normal up, z propagation. y = 0 at the BOX top / LT bottom.
# Origin: optical axis of the RIGHT-hand waveguide in x (centred in its 6 um gap). Signal electrode centre (mirror plane) at x = -18; LEFT waveguide at x = -36.
# Both arms are in the electrostatic domain (symmetry none); the optical mode is solved on the right arm.
optics:
  wavelength_nm: 1550
  polarization: TE
  mode_index: 0
  group_index_from: finite_difference_wavelength
  ng_fixed: null
  eo_axis: auto

materials:
  lithium_tantalate:
    crystal: {cut: x, propagation: y}
    n_o: 2.119
    n_e: 2.123
    eps_r: {perp: 54.0, par: 43.0}
    r_pm_per_v: {r33: 30.5, r51: 20.0}
  silicon_dioxide: {n: 1.444, eps_r: 3.9}
  silicon: {n: 3.475, eps_r: 11.9}
  gold: {conductor: true, sigma_Sm: 4.1e7, n_complex: null}
  air: {n: 1.0, eps_r: 1.0}

geometry:
  symmetry: none
  domain: {x_um: [-260, 225], y_um: [-250, 120]}
  regions:
    - {name: ambient, material: air, rect: {x_um: [-260, 225], y_um: [-250, 120]}}
    - {name: substrate, material: silicon, rect: {x_um: [-260, 225], y_um: [-529.7, -4.7]}}
    - {name: box, material: silicon_dioxide, rect: {x_um: [-260, 225], y_um: [-4.7, 0]}}
    - {name: lt_slab, material: lithium_tantalate, rect: {x_um: [-260, 225], y_um: [0, 0.3]}}
    - {name: lt_rib_r, material: lithium_tantalate, polygon_um: [[-1.2, 0.3], [1.2, 0.3], [1.1, 0.6], [-1.1, 0.6]]}
    - {name: lt_rib_l, material: lithium_tantalate, polygon_um: [[-37.2, 0.3], [-34.8, 0.3], [-34.9, 0.6], [-37.1, 0.6]]}
  electrodes:
    - {name: signal, role: signal, weight: 1.0, rect: {x_um: [-33, -3], y_um: [0.3, 1.3]}, material: gold}
    - {name: ground_r, role: ground, weight: 0.0, rect: {x_um: [3, 33], y_um: [0.3, 1.3]}, material: gold}
    - {name: ground_l, role: ground, weight: 0.0, rect: {x_um: [-69, -39], y_um: [0.3, 1.3]}, material: gold}
  optical_window: {x_um: [-2.9, 2.9], y_um: [-1.5, 1.5]}
  mesh: {max_edge_um: 2.0, electrode_edge_um: 0.05}
line:
  length_mm: 7.5
  conductor_loss_model: skin_effect_wheeler
  rf_loss_table: null
  source_ohm: 50
  load_ohm: 50
  differential: false              # single-ended G-S-G probe on the centre line; push-pull arises from the arm placement
  loading: {type: none, period_um: null, loaded_length_um: null, unloaded_cross_section: null, loaded_cross_section: null}
sweep: {f_start_ghz: 0.1, f_stop_ghz: 110, n_points: 220}
alt_geometries: {}

targets:
  # Measured, 7.5 mm device (devices.csv row chen2026-a)
  - {metric: vpi_l_dc_vcm, value: 2.4, tol_rel: 0.15, source: {device_id: chen2026-a, field: vpil_dc_vcm}}
  - {metric: n_rf, at_ghz: 47, value: 2.2, tol_abs: 0.1, source: {device_id: chen2026-a, field: n_rf}}
  # Not targets: the 3 dB bandwidth claim (exceeds 67 GHz) is contradicted by the measured trace and not entered; Z0 has no single value (ripples above 45 GHz); RF loss entries are inconsistent in the paper
reported_curves: []

provenance:
  optics.wavelength_nm: {class: paper_exact, locator: "p.3 (simulation at 1550 nm); p.5 (input light at 1550 nm)"}
  optics.polarization: {class: paper_exact, locator: "p.5 Sec. 3 (TE polarization, r33)"}
  optics.group_index_from: {class: project_inference, note: "paper quotes ng = 2.2 without a source (p.5); engine derives it by finite difference"}
  materials.lithium_tantalate.crystal: {class: paper_exact, locator: "p.2 (x-cut LTOI); p.5 (light propagates along y)"}
  materials.lithium_tantalate.n_o: {class: standard_reference, citation: "Wang et al., Nature 629, 784 (2024), Extended Data Table 1 (references/wang2024b/text.md p.15, table image img_p15_1.png), 1550 nm", note: "2.119; paper states no LT indices"}
  materials.lithium_tantalate.n_e: {class: standard_reference, citation: "Wang et al., Nature 629, 784 (2024), Extended Data Table 1 (references/wang2024b/text.md p.15, table image img_p15_1.png), 1550 nm", note: "2.123"}
  materials.lithium_tantalate.eps_r: {class: standard_reference, citation: "Wang et al., Nature 629, 784 (2024), Extended Data Table 1 (references/wang2024b/text.md p.15, table image img_p15_1.png), 1550 nm, 100 kHz", note: "eps_11,22 = 54, eps_33 = 43; low-frequency permittivity"}
  materials.lithium_tantalate.r_pm_per_v: {class: standard_reference, citation: "Wang et al., Nature 629, 784 (2024), Extended Data Table 1 (references/wang2024b/text.md p.15, table image img_p15_1.png), 1550 nm", note: "r33 = 30.5, r51 = 20 only; r13 and r22 left out (see missing)"}
  materials.silicon_dioxide.n: {class: standard_reference, citation: "Mao et al., APL Photon. 7, 126103 (2022) (references/mao2022/text.md p.3, printed 126103-2: nSiO2 = 1.444)", note: "the paper states no SiO2 index"}
  materials.silicon_dioxide.eps_r: {class: standard_reference, citation: "Yang et al., Chin. Opt. Lett. 20, 022502 (references/yang2022/text.md p.2: SiO2 eps about 3.9)", note: "value quoted by another paper; this paper gives no SiO2 permittivity"}
  materials.silicon.eps_r: {class: standard_reference, citation: "Yang et al., Chin. Opt. Lett. 20, 022502 (references/yang2022/text.md p.2: Si eps about 11.9)", note: "value quoted by another paper (changed from 11.7 to this cited value); this paper states no silicon permittivity or substrate resistivity"}
  materials.silicon.n: {class: standard_reference, citation: "Mao et al., APL Photon. 7, 126103 (2022) (references/mao2022/text.md p.3, printed 126103-2: nSi = 3.475)", note: "outside the optical window, not used by the solve"}
  materials.gold.sigma_Sm: {class: unknown, note: "UNVERIFIED placeholder 4.1e7 S/m (no source read); the paper does not state the film conductivity"}
  line.length_mm: {class: paper_exact, locator: "p.2 Sec. 2; p.4 Fig. 2(a) (7.5 mm modulation section)"}
  line.source_ohm: {class: project_inference, note: "VNA ports assumed 50 ohm; characteristic impedance designed close to 50 ohm (p.3)"}
  line.load_ohm: {class: project_inference, note: "termination not described in the text; 50 ohm assumed"}
  line.differential: {class: project_inference, note: "G-S-G with one waveguide in each gap (Fig. 1(a) inset); single-ended drive, push-pull by geometry; the paper never states push-pull"}
  line.conductor_loss_model: {class: project_inference, note: "paper gives a measured and a simulated RF loss curve (Fig. 2(c)) that disagree with the quoted alpha0; model choice left to the engine"}
  geometry.regions.substrate: {class: project_inference, locator: "p.2 (silicon substrate)", note: "thickness not stated; region clipped to the domain"}
  geometry.regions.box: {class: paper_exact, locator: "p.2 Sec. 2 (4.7 um SiO2)"}
  geometry.regions.lt_slab: {class: paper_exact, locator: "p.2 Sec. 2 (600 nm LT, ridge height 300 nm)", note: "slab 300 nm = 600 - 300"}
  geometry.regions.lt_rib_r: {class: figure_digitized, locator: "p.3 Fig. 1(a) inset (top 2.2 um, bottom 2.4 um, height 300 nm); p.2 (sidewall 69 deg)", note: "dimensions read from the labelled inset; the stated 69 deg (reference not stated) gives a bottom width of about 2.4 um, consistent with the label"}
  geometry.regions.lt_rib_l: {class: project_inference, note: "mirror image of the right-hand ridge about the signal centre"}
  geometry.electrodes.signal: {class: figure_digitized, locator: "p.3 Fig. 1(a) inset (30 um wide, 1 um Au, 6 um gap)", note: "edge 3 um from the waveguide axis (waveguide assumed centred in the 6 um gap); electrodes sit on the LT slab, no cladding drawn"}
  geometry.electrodes.ground_r: {class: project_inference, locator: "p.3 Fig. 1(a) inset", note: "ground width not labelled; taken equal to the signal width (the inset draws it about 1.2 times wider)"}
  geometry.electrodes.ground_l: {class: project_inference, note: "mirror of ground_r"}
  geometry.optical_window: {class: project_inference, note: "crop |x| < 2.9 um, inside the electrode edge at 3 um"}
  geometry.domain: {class: project_inference, note: "lateral extent and vertical -250..120 um; open-boundary treatment is an engine choice"}
  geometry.mesh: {class: project_inference}

missing:
  - ground electrode width (not labelled; taken equal to the signal width)
  - waveguide position inside the 6 um gap (assumed centred)
  - silicon substrate thickness and resistivity
  - upper cladding (none shown in the inset; not stated)
  - sidewall-angle reference plane (69 deg stated without it)
  - LT refractive indices, RF permittivity, r13/r22 (standard_reference values from another paper)
  - gold film conductivity (4.1e7 S/m is an UNVERIFIED placeholder)
  - termination impedance; temperature
limitations:
  - scalar_optical_not_full_vector
  - quasi_static_2d_rf
  - rectangular_or_polygon_sidewalls_only
  - no_3d_launch_pad_effects
  - "The wide probing region (about 10 percent of the length), tapers and the 1 um to 2.2 um waveguide tapers near the MMIs are not modelled"
  - "Lossless silicon substrate (resistivity not stated)"
