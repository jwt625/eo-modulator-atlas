schema: eo-atlas.sim/v1
id: mao2022-a
paper_id: mao2022
device_id: mao2022-a
title: Mao 2022, 6.0 mm a-Si-loaded unetched TFLN MZM on SiO2/Si with G-S-G line (push-pull arms by geometry)
repro_grade: B
validation_status: unvalidated
chain: [electrostatics, optical_mode, eo_overlap, rf_line, eo_response]

# Conventions follow sims/chen2022/config.yaml and sims/qi2024/config.yaml.
# Coordinate frame: x lateral (paper Z), y film normal up (paper X), z propagation (paper Y). y = 0 at the BOX top / LN bottom.
# Origin: optical axis of the RIGHT-hand a-Si strip in x. Signal electrode centre at x = -11 um (mirror plane); LEFT strip at x = -22 um.
# Both arms are in the electrostatic domain (symmetry none); the optical mode is solved on the right arm.
# Strips are assumed centred in the 6.0 um gaps (paper Fig. 2(b)); all three electrodes are 16 um wide (ground widths not stated).
params:
  film_um: {value: 0.7, unit: um, description: unetched X-cut LN film thickness}
  strip_w_um: {value: 1.0, unit: um, description: a-Si loading strip width}
  strip_t_um: {value: 0.07, unit: um, description: a-Si loading strip thickness}
  box_um: {value: 2.0, unit: um, description: SiO2 BOX thickness}
  substrate_um: {value: 98, unit: um, description: Si handle kept in the model (truncated)}
  cladding_um: {value: 1.6, unit: um, description: SiO2 upper cladding above the LN surface}
  gap_um: {value: 6.0, unit: um, description: electrode gap (strip centred)}
  signal_w_um: {value: 16, unit: um, description: signal width}
  ground_w_um: {value: 16, unit: um, description: ground width (not stated; equal to the signal width assumed)}
  metal_um: {value: 1.5, unit: um, description: Au electrode thickness}

optics:
  wavelength_nm: 1550
  polarization: TE
  mode_index: 0
  group_index_from: perturbation
  ng_fixed: null
  eo_axis: auto
  eo: {arm_drive: two_arm_field_resolved, terminal_drive: single_ended}   # arm windows generated by the template (A on the right strip, B mirrored on the left strip)

materials:
  lithium_niobate:
    library: lithium_niobate_congruent   # eps_r.perp 44.3 (clamped), r13 8.6, r22 3.4, r51 28.0 (clamped) from the engine library
    crystal: {cut: x, propagation: y}
    n_o: 2.211
    n_e: 2.138
    eps_r: {par: 28.0}                   # paper value overrides the library par (27.9)
    r_pm_per_v: {r33: 31.0}              # paper value overrides the library r33 (30.8)
  amorphous_silicon: {n: 3.475, eps_r: 11.7}
  silicon: {library: silicon}
  silicon_dioxide: {n: 1.444, eps_r: 3.9}
  gold: {library: gold_bulk_293k, n_complex: null}
  air: {n: 1.0, eps_r: 1.0}

template:
  type: tfln_rib_gsg
  materials: {film: lithium_niobate, box: silicon_dioxide, substrate: silicon, ambient: air, cladding: silicon_dioxide, electrode: gold, strip: amorphous_silicon}
  film_thickness_um: "=film_um"
  etch_depth_um: 0                     # unetched film, loaded by an a-Si strip
  loading_strip: {width_um: "=strip_w_um", thickness_um: "=strip_t_um"}
  box_thickness_um: "=box_um"
  substrate_thickness_um: "=substrate_um"
  cladding: {thickness_um: "=cladding_um", from: film_top}
  electrodes: {placement: on_slab, gap_um: "=gap_um", signal_width_um: "=signal_w_um", ground_width_um: "=ground_w_um", thickness_um: "=metal_um"}
  arms: push_pull
  domain: {margin_x_um: 100, air_above_um: 57.7}
  optical_window: {half_width_um: "=min(2.9, gap_um / 2 - 0.1)", y_um: [-1.5, 2.2]}   # 2.9 um at the stated 6.0 um gap; clears the electrodes by 0.1 um at smaller gaps
  mesh: {max_edge_um: 2.0, electrode_edge_um: 0.05}
line:
  length_mm: 6.0
  conductor_loss_model: skin_effect_wheeler
  conductor_thickness_model: slab_symmetric   # coplanar electrodes, both faces carry current (DevLog-036 round 3, audit R2-2)
  include_internal_inductance: true
  dielectric_loss_model: none
  source_ohm: 50
  load_ohm: 50
  differential: false              # single-ended GSG probe on the centre line; push-pull arises from the arm placement
  loading: {type: none, period_um: null, loaded_length_um: null, unloaded_cross_section: null, loaded_cross_section: null}
sweep: {f_start_ghz: 0.1, f_stop_ghz: 70, n_points: 140}
alt_geometries: {}

targets:
  # Measured (devices.csv row mao2022-a)
  - {metric: vpi_l_dc_vcm, value: 1.9, tol_rel: 0.15, vpi_convention: mzm_push_pull, source: {device_id: mao2022-a, field: vpil_dc_vcm, drive_frequency_hz: 10000, drive_locator: "p.5 (10 kHz, 5.0 Vpp)", note: "Vpi 3.2 V x 6.0 mm; arm drive convention not defined by the authors; vpi_convention copied from the devices row"}}
  - {metric: bw3db_ghz, value: 60, tol_rel: 0.15, reference: low_freq_unstated, source: {device_id: mao2022-a, field: bw3db_ghz}}
  # Authors' own simulation values (basis simulated), cross-solver references
  - {metric: n_rf, value: 2.34, tol_abs: 0.1, source: {device_id: mao2022-a, field: n_rf, basis: simulated}}
  - {metric: z0_ohm, value: 44, tol_abs: 3.0, source: {device_id: mao2022-a, field: z0_ohm, basis: simulated}}
  - {metric: ng_opt, value: 2.62, tol_abs: 0.1, source: {device_id: mao2022-a, field: ng_opt, basis: simulated}}
reported_curves: []

studies:
  gap_fig1f:
    type: parametric
    description: stated 6.0 um gap vs the 4.84 um gap of the paper's own simulated field plot (Fig. 1(f), digitized)
    stages: [electrostatics, optical_mode, eo_overlap]
    sweep: [{param: gap_um, values: [6.0, 4.84]}]
    outputs: [vpi_l_dc_vcm, vpi_dc_v, n_eff]
    sweep_targets:
    - {at: {gap_um: 6.0}, metric: vpi_l_dc_vcm, value: 1.9, tol_rel: 0.15, vpi_convention: mzm_push_pull, source: {device_id: mao2022-a, field: vpil_dc_vcm, drive_frequency_hz: 10000, note: "measured device, stated gap 6.0 um"}}

provenance:
  studies.gap_fig1f: {class: figure_digitized, locator: "Fig. 1(f): inner electrode edges at Z = -2.41 and +2.41 um, gap 4.84 +- 0.1 um (34.6 px/um from the tick labels), digitized in DevLog-029 (2026-10-15); text p.4 and the Fig. 2(b) label give 6.0 um", note: "alternative gap of the paper's own simulation; the default geometry keeps the stated 6.0 um"}
  optics.wavelength_nm: {class: paper_exact, locator: "p.4 Sec. II B (1550 nm)"}
  optics.polarization: {class: paper_exact, locator: "p.3 Sec. II A (TE mode, E_Z)"}
  optics.group_index_from: {class: project_inference, note: "paper quotes a simulated ng of 2.62; engine derives it by finite difference and compares as a target; changed 2026-10-15 from finite_difference_wavelength (written when it was the only computed group index, meaning computed by the model, not fixed) to perturbation, the engine default; FD stays selectable (DevLog-026 round 4)"}
  materials.lithium_niobate.crystal: {class: paper_exact, locator: "p.3 Sec. II A (X-cut); propagation along Y from Fig. 1(a,d,f) axes"}
  materials.lithium_niobate.n_o: {class: paper_exact, locator: "p.3 Sec. II A (n_ord,LN = 2.211)"}
  materials.lithium_niobate.n_e: {class: paper_exact, locator: "p.3 Sec. II A (n_ext,LN = 2.138)"}
  materials.lithium_niobate.eps_r: {class: paper_exact, locator: "p.3 Sec. I (eps_LN = 28 along Z stated)", note: "par = 28 stated (paper); perp = 44.3 from the engine library lithium_niobate_congruent (clamped eps^S, Weis and Gaylord 1985 Table 1 p.197 row [23]; standard_reference, see engine/data/materials.json)"}
  materials.lithium_niobate.r_pm_per_v: {class: paper_exact, locator: "p.2 Sec. I (r33 = 31 pm/V stated)", note: "r33 = 31 stated (paper); r13 8.6, r22 3.4, r51 28.0 from the engine library lithium_niobate_congruent (clamped experimental values; standard_reference, secondary source)"}
  materials.lithium_niobate.library: {class: standard_reference, citation: "engine/data/materials.json library lithium_niobate_congruent (eps_r: Weis and Gaylord, Appl. Phys. A 37, 191 (1985), Table 1 p.197 row [23] eps^S, clamped; r: Weis and Gaylord 1985 Table 4 p.199 r^S 633 nm row [45], clamped)"}
  materials.amorphous_silicon.n: {class: paper_exact, locator: "p.3 Sec. II A (n_Si = 3.475)"}
  materials.amorphous_silicon.eps_r: {class: unknown, note: "UNVERIFIED placeholder 11.7; the paper states no Si RF permittivity"}
  materials.silicon: {class: standard_reference, citation: "engine/data/materials.json library silicon (eps_r 11.7: Zhu et al. 2021 Table 1; optical: Salzberg and Villa 1957)", note: "substrate constants not stated by the paper; was an unverified placeholder n = 3.476, eps_r = 11.7 before 2026-10-14"}
  materials.silicon_dioxide: {class: paper_exact, locator: "p.3 Sec. II A (n_SiO2 = 1.444); p.3 Sec. I (eps_SiO2 = 3.9)"}
  materials.gold.sigma_Sm: {class: standard_reference, citation: "engine/data/materials.json library gold_bulk_293k (Matula, J. Phys. Chem. Ref. Data 8, 1147 (1979), Table 5: 2.214e-8 ohm m at 293 K)", note: "bulk annealed gold 4.5167e7 S/m; the evaporated film conductivity is not stated and is generally lower; the 10 nm Cr adhesion layer is ignored (was placeholder 4.1e7 before 2026-10-14)"}
  materials.air: {class: paper_exact, locator: "p.3 Sec. I (eps_air = 1.0)", note: "n = 1 follows from eps = 1.0"}
  line.length_mm: {class: paper_exact, locator: "p.4 Sec. II B (6.0 mm phase shifter)"}
  line.load_ohm: {class: paper_exact, locator: "p.5 Sec. II C (50 ohm termination probe)"}
  line.source_ohm: {class: project_inference, note: "50 ohm VNA / probe"}
  line.differential: {class: project_inference, note: "GSG with one arm per gap (Fig. 2); push-pull MZI drive stated (p.3, p.5) but implemented here by geometry with a single-ended signal"}
  line.conductor_loss_model: {class: project_inference, note: "no RF loss coefficient stated"}
  line.conductor_thickness_model: {class: project_inference, note: "coplanar electrodes (all electrodes on one plane, no nearby ground plane): top and bottom faces carry equal quasi-TEM current, so the symmetric slab Z_s = (k/sigma) coth(k t/2) per face; t = smallest electrode bounding-box dimension; DevLog-036 round 3 (audit R2-2)"}
  line.include_internal_inductance: {class: project_inference, note: "skin-effect conductor: internal inductance omega L_i = R' included (modelling choice, 2026-10-14)"}
  line.dielectric_loss_model: {class: project_inference, note: "no loss tangent stated; dielectric loss declared none (assumption, see limitations)"}
  optics.eo: {class: project_inference, note: "arm windows from the a-Si strip positions (A = optical_window on the right strip, B mirrored about the signal centre on the left strip); single-ended G-S-G drive"}
  params.film_um: {class: paper_exact, locator: "p.3 Sec. II A (700 nm LN, not patterned)"}
  params.box_um: {class: paper_exact, locator: "p.3 Sec. II A (2.0 um SiO2 on Si)"}
  params.substrate_um: {class: project_inference, note: "silicon handle thickness not stated; clipped to 98 um below the BOX"}
  template.loading_strip: {class: paper_exact, locator: "p.3 Sec. II A (70 nm a-Si); p.4 Sec. II B (1.0 um wide)", note: "rectangular profile, sidewall slope not stated; centred in the 6.0 um gap"}
  template.arms: {class: project_inference, note: "mirror of the right strip about the signal centre"}
  params.cladding_um: {class: project_inference, locator: "p.3 Sec. II A (1.6 um SiO2 upper cladding)", note: "1.6 um measured from the LN surface (top at 2.3 um) is assumed; reference surface not stated"}
  template.materials.ambient: {class: project_inference, note: "air above the cladding"}
  params.gap_um: {class: paper_exact, locator: "p.4 Sec. II A (6.0 um spacing)", note: "strips assumed centred in the gaps (Fig. 2(b))"}
  params.metal_um: {class: paper_exact, locator: "p.4 Sec. II A (1.5 um thick)"}
  params.signal_w_um: {class: paper_exact, locator: "p.4 Sec. II A (1.5 um thick, 16 um wide, 6.0 um spacing)", note: "sits on the LN surface beside the Si strip (Fig. 1(b)); 10 nm Cr ignored; gap edge at 3 um from the strip axis"}
  params.ground_w_um: {class: project_inference, locator: "p.4 Sec. II A", note: "ground width not stated; taken equal to the 16 um electrode width"}
  template.electrodes.layout: {class: project_inference, locator: "p.4 Sec. II A", note: "mirror of the right ground"}
  template.optical_window: {class: project_inference, note: "half width min(2.9, gap/2 - 0.1) um: 2.9 um inside the 3 um electrode edge at the stated gap (unchanged); clears the electrodes at the 4.84 um study gap"}
  template.domain: {class: project_inference, note: "lateral +-130 um about the signal centre; vertical -100..60 um; open-boundary treatment is an engine choice"}
  template.mesh: {class: project_inference}

missing:
  - "electrode gap of the paper's own simulation: Fig. 1(f) shows about 4.84 +- 0.1 um (digitized, DevLog-029) while the text (p.4) and Fig. 2(b) state 6.0 um (study gap_fig1f)"
  - ground electrode width (not stated; 16 um assumed)
  - silicon handle thickness and resistivity (not stated)
  - reference surface of the 1.6 um SiO2 cladding (assumed LN surface)
  - sidewall slope and exact profile of the a-Si strip
  - RF permittivity perp of LN and Pockels components other than r33 (library standard values used, not paper values); RF permittivity of a-Si (placeholder); SiO2 and LN loss tangents; Au film conductivity (bulk value used)
  - Vpi drive convention (push-pull MZI stated, arm-level definition not given)
  - temperature
  - optical input power
limitations:
  - "The paper's VpiL estimate (Eq. (2)) assumes a uniform V/g field with Gamma = the LN Poynting fraction 0.73 and n = 2.211 (DevLog-029 reading); the measured VpiL is not expected to match a field-resolved overlap"
  - "Vpi measured at 10 kHz (p.5) is compared with clamped Pockels constants; result.targets[].lowFrequencyRange gives the r33-scaled unclamped estimate"
  - quasi_static_2d_rf
  - rectangular_or_polygon_sidewalls_only
  - no_3d_launch_pad_effects
  - "Y-branch, 200 um adiabatic tapers and probe pads are not represented; the paper's CST model is 3D"
  - "Cr 10 nm adhesion layer ignored; Au conductivity is a placeholder, so RF loss and the 60 GHz bandwidth are not expected to be reproduced"
  - "dielectric_loss_model none is an assumption (no loss tangent stated): the RF attenuation is conductor-only"
  - "LN Pockels and RF constants partly from the engine library (clamped values from secondary open-access compilations); r dispersion with wavelength is not modelled"
  - "The paper reports a LN confinement factor of 73 percent (p.4, energy-flux definition); it is not a target here"
