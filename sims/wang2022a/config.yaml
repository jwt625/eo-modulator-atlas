limitations:
  - scalar_optical_not_full_vector
  - quasi_static_2d_rf
  - rectangular_or_polygon_sidewalls_only
  - no_3d_launch_pad_effects
  - "One G-S-G cut of a GSGSG line; shared middle ground of the I and Q MZMs is not represented"
  - "Cladding modelled as a flat layer to electrode top + 2 um (reference surface not stated)"
  - "The stated 38 ohm termination is entered as load_ohm; the 50 ohm source impedance is assumed (project_inference)"
  - "S21 in Fig. 3(c) includes RF probes; target is non-comparable"
