# Coordinate frame: x lateral, y film normal up, z propagation. y = 0 at the BOX top / LN bottom.
# Origin: optical axis of the RIGHT-hand waveguide in x; mirror plane (signal centre) at x = -10.8 um; LEFT waveguide at x = -21.6 um.
# Both arms are in the electrostatic domain (symmetry none); the optical mode is solved on the right arm.
# Only the 630 nm row is configured: Vpi.L at 520/450 nm differs through the missing wavelength-dependent r33 and indices.
schema: eo-atlas.sim/v1
id: xue2023-a
paper_id: xue2023
device_id: xue2023-a
title: Xue 2023, 8 mm full-visible TFLN push-pull MZM at 630 nm (electrodes on the LN slab, 0.8 um waveguide-electrode gap)
repro_grade: B
validation_status: unvalidated
chain: [electrostatics, optical_mode, eo_overlap, rf_line, eo_response]
optics: {wavelength_nm: 630, polarization: TE, mode_index: 0, group_index_from: finite_difference_wavelength, ng_fixed: null, eo_axis: auto}
materials:
  lithium_niobate:
    crystal: {cut: x, propagation: y}
    eps_r: {perp: 43.0, par: 28.0}
    r_pm_per_v: {r13: 8.6, r22: 3.4, r33: 30.8, r51: 28.0}
  silicon_dioxide: {eps_r: 3.9}
  gold: {conductor: true, sigma_Sm: 41000000.0, n_complex: null}
  air: {n: 1.0, eps_r: 1.0}
geometry:
  symmetry: none
  domain:
    x_um: [-80, 60]
    y_um: [-100, 60]
  regions:
  - name: ambient
    material: air
    rect:
      x_um: [-80, 60]
      y_um: [-100, 60]
  - name: insulating_substrate
    material: silicon_dioxide
    rect:
      x_um: [-80, 60]
      y_um: [-100, 0]
  - name: ln_slab
    material: lithium_niobate
    rect:
      x_um: [-80, 60]
      y_um: [0, 0.12]
  - name: ln_rib_r
    material: lithium_niobate
    polygon_um:
    - [-0.545, 0.12]
    - [0.545, 0.12]
    - [0.5, 0.3]
    - [-0.5, 0.3]
  - name: ln_rib_l
    material: lithium_niobate
    polygon_um:
    - [-22.145, 0.12]
    - [-21.055, 0.12]
    - [-21.1, 0.3]
    - [-22.1, 0.3]
  electrodes:
  - name: signal
    role: signal
    weight: 1.0
    rect:
      x_um: [-20.3, -1.3]
      y_um: [0.12, 0.82]
    material: gold
  - name: ground_r
    role: ground
    weight: 0.0
    rect:
      x_um: [1.3, 20.3]
      y_um: [0.12, 0.82]
    material: gold
  - name: ground_l
    role: ground
    weight: 0.0
    rect:
      x_um: [-41.9, -22.9]
      y_um: [0.12, 0.82]
    material: gold
  optical_window:
    x_um: [-1.25, 1.25]
    y_um: [-0.8, 0.9]
  mesh: {max_edge_um: 1.0, electrode_edge_um: 0.03}
line:
  length_mm: 8
  conductor_loss_model: skin_effect_wheeler
  rf_loss_table: null
  source_ohm: 50
  load_ohm: 50
  differential: false
  loading: {type: none, period_um: null, loaded_length_um: null, unloaded_cross_section: null, loaded_cross_section: null}
sweep: {f_start_ghz: 0.1, f_stop_ghz: 50, n_points: 100}
alt_geometries: {}
targets:
- metric: vpi_l_dc_vcm
  value: 0.48
  tol_rel: 0.15
  source: {device_id: xue2023-a, field: vpil_dc_vcm, comparable: false, note: NON-COMPARABLE until LN Pockels coefficients at 630 nm are supplied; the paper states r33 rises toward shorter wavelength}
reported_curves: []
