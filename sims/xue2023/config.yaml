  optics.polarization: {class: project_inference, note: TE assumed for x-cut with in-plane electrodes; the paper's phase formula uses r33 (p.1)}
  optics.group_index_from: {class: project_inference, note: paper plots simulated optical group indices at 400/550/700 nm (Fig. 1(e)); none at 630 nm}
