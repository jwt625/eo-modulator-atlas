- device_id: lu2020-a
  field: epitaxy_or_stack
  value: 'Layer stack bottom to top: silicon wafer with 2 um oxide; 1 um aluminum bottom electrode; 3 um sol-gel SiO2; 40 nm PECVD silicon strip core, 4 um wide, e-beam patterned and SF6 ICP etched; 1 um
    side-chain EO polymer layer; 3 um sol-gel SiO2; gold strip-line electrodes 8 mm long. TM0 mode, polymer index 1.67, silicon index 3.48, confinement factor in polymer 73.8 percent (simulated, Supplementary
    Note 1).'
  unit: ''
  basis: design_target
  locator: p.3; p.2 Fig. 1b,c; p.7 Methods; supplement p.3 Note 1
  note: Confinement factor 73.8 percent from modal calculation
