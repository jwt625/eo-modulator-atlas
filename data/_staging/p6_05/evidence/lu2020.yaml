  field: r_eff_pm_per_v
  value: 223
  unit: pm/V
  basis: derived
  locator: supplement p.4 Note 2 Eq. 6; supplement p.5 Table 1
  note: In-device r33 from measured Vpi*L 1.44 V cm, confinement 0.738, d_eo 1 um, d_c 6 um, eps about 3; n = 1.66 gives n^3 r33 = 1021 pm/V; the authors' Eq. 5-6 (supplement p.3-4 Note 2) treat 1.44 V cm as a single-length pi shift (L = 8 mm, no push-pull factor of 2); the drive form is not stated
