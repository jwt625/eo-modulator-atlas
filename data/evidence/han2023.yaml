- device_id: han2023-a
  field: epitaxy_or_stack
  value: 'Fishbone Bragg-grating CROW on 220 nm SOI: period 300 nm, sidewall corrugation depth 190 nm, Np 20 periods, Nr 10 resonators, lambda/4 phase-shifter regions; lateral pn junction, P and N 5.0e17 cm^-3 at the core, P+ and N+ 2.0e18 cm^-3, P++ and N++ 4.0e20 cm^-3; 90 nm partially etched slab; GSGSG Cu electrode'
  unit: ''
  basis: design_target
  locator: p.2 Design and principles; p.5 Sample fabrication; p.7 Materials and Methods; p.4 Fig. 2(A)
  note: Doping levels from Methods
- device_id: han2023-a
  field: max_baud_gbd
  value: 112
  unit: GBd
  basis: derived
  locator: p.6 Discussion; p.5 Experimental characterization
  note: OOK so baud equals the 112 Gb/s bit rate; authors state a 112 GBaud symbol rate
- device_id: han2023-a
  field: max_line_rate_gbps
  value: 112
  unit: Gb/s
  basis: measured
  locator: p.5-6 Experimental characterization; p.7 Fig. 4(E,H,I)
  note: Demonstrated rate (eye and BER measured), not an FEC-compliant rate
- device_id: han2023-a
  field: modulation_format
  value: OOK, 70 / 84 / 98 / 100 / 112 Gb/s; eye diagrams at 100 and 112 Gb/s without pre-equalization or DSP; BER with offline FFE and MLSE at the receiver; BER at 1550 nm (Table S2) 1.86e-5, 9.85e-5, 2.17e-3 and 1.64e-2 at 70, 84, 98 and 112 Gb/s; at 1550 nm 70, 84 and 98 Gb/s are below the 7 percent HD-FEC value (3.8e-3), and at 98 Gb/s no other wavelength is (7.14e-3 to 4.07e-2); 112 Gb/s best BER 1.64e-2 is above the SD-FEC value 2e-3 quoted in the text and marginally above the 20 percent FEC line (about 1.5e-2, Fig. 4(I))
  unit: ''
  basis: measured
  locator: p.5-6 Experimental characterization; p.7 Fig. 4(H,I); supplement p.15 Table S2; supplement p.26 Fig. S17
  note: Text p.6 claims BER below 2e-3 up to 112 Gb/s (~93 Gb/s net); Table S2 and Fig. S17(D) contradict it
