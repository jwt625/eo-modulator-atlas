- device_id: han2023-a
  field: epitaxy_or_stack
  value: 'Fishbone Bragg-grating CROW on 220 nm SOI: period 300 nm, sidewall corrugation depth 190 nm, Np 20 periods, Nr 10 resonators, lambda/4 phase-shifter regions; lateral pn junction, P and N doping 5.0e17 cm^-3 at the core, P+/P++/N+/N++ contact doping (levels not stated); 90 nm partially etched slab; GSGSG Cu electrode'
  unit: ''
  basis: design_target
  locator: p.10, Sec. 3; p.14-15, Methods; p.28, Fig. 2(a)
  note: Doping labels P+/P++/N+/N++ from Fig. 2(a); concentrations of those regions not given.
- device_id: han2023-a
  field: max_baud_gbd
  value: 112
  unit: GBd
  basis: derived
  locator: p.12, Sec. 3; p.13; p.31, Fig. 4(g-h)
  note: OOK so baud equals the 112 Gb/s bit rate; authors state a symbol rate beyond 110 GBaud.
- device_id: han2023-a
  field: modulation_format
  value: OOK, 70 / 84 / 98 / 100 / 112 Gb/s; eye diagrams at 100 and 112 Gb/s without pre-equalization or DSP; BER data with offline FFE and MLSE at the receiver; BER below the 7 percent HD-FEC line (3.8e-3) up to 98 Gb/s; at 112 Gb/s best BER about 1.7e-2 (Fig. 4(h), figure read), marginally above the 20 percent FEC line (about 1.5e-2), unlike the text claim of below 2e-3
  unit: ''
  basis: measured
  locator: p.11-12, Sec. 3; p.15-16, Methods; p.31, Fig. 4(d,g,h)
  note: Eyes in real time without transmitter pre-equalization; BER processed offline with FFE and MLSE. Fig. 4(h) contradicts text FEC claim at 112 Gb/s.
- device_id: han2023-a
  field: max_line_rate_gbps
  value: 112
  unit: Gb/s
  basis: measured
  locator: p.12, Sec. 3; p.31, Fig. 4(d,h)
  note: 'Demonstrated rate (eye, BER measured), not FEC-compliant: best 112 Gb/s BER about 1.7e-2 (Fig. 4(h)) vs text claim below 2e-3; no net rate.'
