  field: bw3db_ghz
  value: 110
  unit: GHz
  basis: derived
  locator: p.11, Sec. 3; p.30-31, Fig. 4(c)
  note: Authors' fit to the S21 curve crosses -3 dB at 110 GHz; measured trace is noisy and reaches about -3 to -4 dB there.
- device_id: han2023-a
  field: bw3db_reference
  value: dc
  unit: ''
  basis: derived
  locator: p.30-31, Fig. 4(c)
  note: Normalized S21 curve starts at 0 dB at low frequency; authors do not state the reference. Peaking of about +1.5 dB near 20 GHz.
- device_id: han2023-a
  field: bw_measured_to_ghz
  value: 110
  unit: GHz
  basis: measured
  locator: p.11, Sec. 3; p.15, Methods
  note: Keysight PNA-X with 110 GHz lightwave component analyzer; response flat over the 110 GHz measurement range per authors.
- device_id: han2023-a
  field: il_onchip_db
  value: 6.8
  unit: dB
  basis: measured
  locator: p.15, Methods, Experimental details
  note: Excludes an unoptimized coupling loss of about 10 dB; includes 5.4 dB phase shifter plus 3 dB couplers, routing and other structures.
