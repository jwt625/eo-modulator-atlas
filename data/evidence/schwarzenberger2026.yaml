- device_id: schwarzenberger2026-a
  field: epitaxy_or_stack
  value: 'Silicon slot waveguide on SOI: rails nominally 240 nm wide and 220 nm high, slot 160 nm, slab 90 nm (design); TEM of a raw device gives rail height 205 nm, rail width 250 nm at the BOX interface
    (caption: about 230 nm), slab 75 nm, slot 130 nm at the base and about 160 nm average, sidewall angle about 10 deg, about 220 nm deep trench into the BOX; rails weakly n-doped (width of weakly doped
    region 340 nm), n+ and n++ slabs and contacts; SOXD-100 organic electro-optic material (index 1.8) deposited into a 5 um wide top-oxide opening; arm length imbalance 40 um; 320 um long RF line; push-pull
    poling via floating ground electrodes'
  unit: ''
  basis: design_target
  locator: p.2-5; p.4 Fig. 2(a); p.7
