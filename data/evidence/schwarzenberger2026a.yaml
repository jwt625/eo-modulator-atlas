- device_id: schwarzenberger2026a-a
  field: epitaxy_or_stack
  value: 'Silicon slot waveguide on SOI, 3 um BOX, 5 um TOX: nominal rails 220 nm high and 220 nm wide, slot 160 nm, slab 90 nm; TEM of a raw device (no OEO): rail height 205 nm, rail width 208 nm and slot
    160 nm at half rail height, slab 75 nm, sidewall inclined 10 deg from the wafer normal, slot over-etched 215 nm into the BOX; multi-level doping n_D / n_D+ / n_D++ with weakly doped width w_weak about
    720 nm; Al vias and GSG line; arm length imbalance about 40 um; field-interaction factor 0.17 (simulated)'
  unit: ''
  basis: design_target
  locator: p.2-3 Sec. II; p.7-8 App. A, Fig. A1
  note: Nominal dimensions design_target; TEM values measured on a raw device without OEO
