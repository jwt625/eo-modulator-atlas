- device_id: schwarzenberger2026a-a
  field: modulation_format
  value: 'PAM4 192 GBd (384 Gbit/s) at 0.95 Vpp: BER 2.7e-2 (below 20% SD-FEC), AIR 332.4, NDR 310.9 Gbit/s (best NDR under sub-1 Vpp drive); PAM4 176 GBd (352 Gbit/s) at 0.94 Vpp: BER 1.4e-2, and highest
    NDR 323.5 Gbit/s (AIR 340.5) at 1.17 Vpp; PAM4 144 GBd at 0.9 Vpp: BER 7.2e-3; PAM4 112 GBd at 0.95 Vpp: BER 1e-3; single carrier IMDD, wavelength 1326 nm'
  unit: ''
  basis: measured
  locator: p.5 Sec. III, Fig. 3; p.6 Fig. 4
  note: BER values from eye-diagram labels Fig. 4
