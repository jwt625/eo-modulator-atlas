  field: max_baud_gbd
  value: 130
  unit: GBd
  basis: measured
  locator: p.5, Fig. 4(f)
  note: 130 Gb/s NRZ below the 2e-2 SD-FEC threshold at suitable received power.
- device_id: zhong2026-a
  field: modulation_format
  value: NRZ 50, 70, 90, 110 Gb/s eyes (SNR 8.23, 6.07, 3.98, 3.17 dB); BER below 3.8e-3 at 110 Gb/s and below 2e-2 at 130 Gb/s
  unit: ''
  basis: measured
  locator: p.5, Fig. 4(b-f)
  note: PRBS 2^13-1, amplifier output about 2 Vpp, 67 GHz cable and probe, -3 V bias.
