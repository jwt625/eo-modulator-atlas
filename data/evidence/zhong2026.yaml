- device_id: zhong2026-a
  field: epitaxy_or_stack
  value: 1D photonic crystal nanobeam cavity (mirror regions plus 10-period tapers, period a reduced linearly to 0.93a) on 220 nm SOI with 90 nm slab; lateral pn junction (p region slightly wider than n),
    P++ and N++ contacts; group index 4.2 to 44 inside the cavity; mode volume 0.12 um^3; designed Rs 150 ohm; on-chip 50 ohm resistor
  unit: ''
  basis: design_target
  locator: p.2-4
  note: Period, hole dimensions and doping levels are in the Supplementary Information, not cached.
