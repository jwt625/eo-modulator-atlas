  field: modulation_format
  value: NRZ 64 Gb/s (SNR 5, ER 9.3 dB) and 80 Gb/s (SNR 4, ER 8 dB) optical eyes; PAM4 24 GBd (SNR 2.2, ER 5.5 dB, 3-bit 32 GBd DAC)
  unit: ''
  basis: measured
  locator: p.6, Sec. V-C; Fig. 15
  note: No pre-distortion or post-processing; eye diagrams only, no BER.
