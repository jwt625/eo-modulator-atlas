  field: drive_vpp_v
  value: 1.4
  unit: V
  basis: measured
  locator: p.6, Sec. V-C
  note: 0.5 V pattern generator output boosted to 1.4 Vpp by a 66 GHz amplifier; DC bias 10 V.
