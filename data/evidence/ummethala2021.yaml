  field: vpil_dc_vcm
  value: 0.13
  formula: U_pi*L = 1.3 V mm (authors, p.1 abstract; p.3) x 0.1 cm/mm = 0.13 V cm; unit conversion only
  inputs:
  - U_pi*L=1.3 V mm
- device_id: ummethala2021-a
  field: prop_loss_db_per_cm
  value: 60
  formula: phase-shifter optical propagation loss 6 dB/mm (authors, approximately; p.5 Sec. 3, p.9 Sec. S1) x 10 mm/cm = 60
    dB/cm; unit conversion only
  inputs:
  - propagation loss=6 dB/mm
- device_id: ummethala2021-a
  field: rf_loss_db_per_cm
  value: 45
  formula: RF propagation loss 4.5 dB/mm at 50 GHz (authors; p.5 Sec. 3; Fig. S8 measured MZM curve, p.15, reads about 4.5
    dB/mm) x 10 mm/cm = 45 dB/cm; unit conversion only; 150 nm gold line, from S-parameters
  inputs:
  - RF loss=4.5 dB/mm
  - rf_loss_freq_ghz=50
